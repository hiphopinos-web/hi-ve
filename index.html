<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AX FESTIVAL 2026 — ME to WE</title>
<!-- 홈 화면에 추가 = 아이콘 한 번으로 실행 (설치·스토어 없음) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131519">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AX FESTIVAL">
<style>
  /* ═══════ AX FESTIVAL 그래픽 시스템 v4 (Planfit 다크 × SK 민트) ═══════
     다크 차콜 배경 + 명도 계층 서피스(그림자·보더 최소) / 민트 = 행동·진행에만 / 탭 활성 = 화이트 */
  :root {
    --ink: #0B0C0E;                     /* 블록·민트 위 텍스트 */
    --paper: #131519;                   /* 페이지 배경 (다크 차콜) */
    --white: #1E2126;                   /* 카드 서피스 (구명 유지 — 의미는 surface) */
    --surface2: #272B31;                /* 한 단계 더 밝은 서피스 (눌림·중첩) */
    --line: #2C3037;                    /* 헤어라인 */
    --mint: #5FEBA9; --mint-deep: #17B877; --blue: #6E9BFF;
    --tint: #14261E; --tint2: #1F4433;  /* 다크 민트 틴트 */
    --hi: #F2F4F6;                      /* 주요 텍스트 (라이트 시절 ink 자리) */
    --tx: #E6E9ED; --muted: #9AA1AB; --faint: #6A7077;
    --fs: 1;                            /* 글자 크기 배율 (설정에서 1 / 1.12 / 1.25) */
    --disp: "Impact", "Franklin Gothic Bold", "Arial Black", "Malgun Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* word-break:keep-all = 한글을 어절 단위로 끊는다 — 단어 중간에서 잘리지 않고 통째로 다음 줄로 */
  body { background: #08090b; font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; display: flex; justify-content: center; color: var(--tx); word-break: keep-all; overflow-wrap: break-word; }
  button, input, textarea { font-family: inherit; }
  #frame { position: relative; width: 100%; max-width: 448px; min-height: 100dvh; background: var(--paper); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
  #frame.splash-mode { height: 100dvh; overflow: hidden; }

  /* ───────── 스플래시 (유지) ───────── */
  #splash { position: absolute; inset: 0; z-index: 100; background: #001F5B; display: flex; flex-direction: column; overflow: hidden; }
  #splash.gone { display: none; }
  #splash video, #staticImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.7s; }
  #loopV { opacity: 0; }
  #splash[data-phase="ready"] #loopV { opacity: 1; }
  #splash[data-phase="ready"] #introV { opacity: 0; pointer-events: none; }
  #staticImg { display: none; }
  #splash[data-phase="static"] #staticImg { display: block; }
  #splash[data-phase="static"] video { display: none; }
  #cover { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 96px; background: none; border: 0; cursor: pointer; color: #fff; }
  #splash[data-phase="cover"] #cover { display: flex; }
  #cover .tap { font-size: calc(15.5px * var(--fs)); font-weight: 600; letter-spacing: 0.05em; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  #silent { margin-top: 12px; font-size: calc(13.5px * var(--fs)); color: rgba(255,255,255,0.5); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
  #skip { position: absolute; right: 20px; bottom: 20px; z-index: 20; display: none; border: 0; cursor: pointer; background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.7); font-size: calc(13.5px * var(--fs)); font-weight: 600; padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(4px); }
  #splash[data-phase="intro"] #skip { display: block; }
  #panel { position: relative; z-index: 10; margin-top: auto; transform: translateY(40px); opacity: 0; pointer-events: none; transition: transform 0.7s, opacity 0.7s; }
  #splash[data-phase="ready"] #panel, #splash[data-phase="static"] #panel { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #panel .inner { background: linear-gradient(to top, #001F5B 0%, rgba(0,31,91,0.85) 60%, transparent 100%); padding: 64px 24px 32px; }
  .tagline { text-align: center; font-size: calc(19px * var(--fs)); font-weight: 800; letter-spacing: 0.2em; color: #fff; }
  .tagline .me { color: rgba(255,255,255,0.6); }
  .tagline .we { color: #FF9E1B; text-shadow: 0 0 12px rgba(255,158,27,0.6); }
  .sub { margin-top: 6px; text-align: center; font-size: calc(13.5px * var(--fs)); color: rgba(255,255,255,0.6); }
  #entryForm { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  #entryForm input { width: 100%; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); padding: 14px 16px; font-size: calc(16.5px * var(--fs)); color: #fff; outline: none; backdrop-filter: blur(4px); }
  #entryForm input::placeholder { color: rgba(255,255,255,0.4); }
  #entryForm input:focus { border-color: #FF9E1B; }
  #err { font-size: calc(14.5px * var(--fs)); color: #fca5a5; display: none; }
  #entryForm button { width: 100%; border: 0; cursor: pointer; border-radius: 16px; background: #F97316; padding: 16px; font-size: calc(16.5px * var(--fs)); font-weight: 700; color: #fff; transition: transform 0.1s; }
  #entryForm button:active { transform: scale(0.98); }
  .note { text-align: center; font-size: calc(12.5px * var(--fs)); color: rgba(255,255,255,0.4); }

  /* 홈 화면에 추가 — 로그인 직후 전용 단계 화면 (풀스크린) */
  #a2hs { position: fixed; inset: 0; z-index: 120; background: var(--paper); overflow-y: auto; animation: fadeIn 0.3s; }
  #a2hs[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  #a2hs .a-wrap { min-height: 100%; max-width: 360px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 44px 24px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
  #a2hs .a-eyebrow { font-family: var(--disp); font-size: calc(13.5px * var(--fs)); letter-spacing: 0.14em; color: var(--mint); }
  #a2hs .a-ico { margin: 18px auto 0; width: 86px; height: 86px; border-radius: 22px; background: var(--white); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 14px 34px rgba(0,0,0,0.45); }
  #a2hs .a-ico b { font-family: var(--disp); font-size: 30px; line-height: 1; color: var(--mint); }
  #a2hs .a-ico small { font-size: calc(10px * var(--fs)); font-weight: 800; letter-spacing: 0.04em; color: var(--hi); }
  #a2hs .a-t { margin-top: 20px; font-size: 24px; font-weight: 800; line-height: 1.35; color: var(--hi); letter-spacing: -0.02em; }
  #a2hs .a-s { margin-top: 10px; font-size: calc(15.5px * var(--fs)); line-height: 1.7; color: var(--muted); }
  #a2hs .a-s b { color: var(--mint); }
  #a2hs #a2hsBody { margin-top: 24px; text-align: left; }
  #a2hs .a-step { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; font-size: calc(15.5px * var(--fs)); font-weight: 700; color: var(--hi); }
  #a2hs .a-step .n { flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--tint); color: var(--mint); display: flex; align-items: center; justify-content: center; font-size: calc(12.5px * var(--fs)); font-weight: 900; }
  #a2hs .a-step .g { font-family: var(--disp); font-size: calc(16.5px * var(--fs)); color: var(--mint); }
  #a2hs .a-go { width: 100%; margin-top: 14px; border: 0; cursor: pointer; border-radius: 14px; background: var(--mint); padding: 15px; font-family: inherit; font-size: calc(16.5px * var(--fs)); font-weight: 800; color: var(--ink); }
  #a2hs .a-note { margin-top: 10px; font-size: calc(13.5px * var(--fs)); line-height: 1.6; color: var(--muted); }
  #a2hs .a-later { width: 100%; margin-top: 10px; border: 0; background: none; cursor: pointer; font-family: inherit; font-size: calc(14.5px * var(--fs)); font-weight: 700; color: var(--faint); padding: 8px; }
  #a2hs .a-url { margin-top: 8px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; font-size: calc(12.5px * var(--fs)); color: var(--muted); word-break: break-all; }

  /* 재방문 — PIN 전용 화면 (영상 스플래시 없이 바로) */
  #quick { position: absolute; inset: 0; z-index: 110; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #quick[hidden] { display: none; }
  #quick .q-card { width: 100%; max-width: 340px; text-align: center; }
  #quick .q-eyebrow { font-family: var(--disp); font-size: calc(13.5px * var(--fs)); letter-spacing: 0.14em; color: var(--mint); }
  #quick .q-hello { margin-top: 14px; font-size: 26px; font-weight: 800; color: var(--hi); letter-spacing: -0.02em; }
  #quick .q-who { margin-top: 8px; font-size: calc(15.5px * var(--fs)); color: var(--muted); }
  #quick .q-who b { color: var(--hi); font-weight: 800; }
  #quick .q-who span { margin-left: 7px; color: var(--faint); font-family: var(--disp); font-size: calc(14.5px * var(--fs)); }
  #quick input { width: 100%; margin-top: 26px; border-radius: 16px; border: 1px solid var(--line); background: var(--white); padding: 16px; font-size: 20px; font-weight: 800; letter-spacing: 0.5em; text-align: center; color: var(--hi); outline: none; }
  #quick input:focus { border-color: var(--mint); }
  #quick input::placeholder { letter-spacing: 0; font-size: calc(16.5px * var(--fs)); font-weight: 700; color: var(--faint); }
  #qErr { display: none; margin-top: 10px; font-size: calc(14.5px * var(--fs)); font-weight: 700; color: #FF6B61; }
  #quick .q-go { width: 100%; margin-top: 14px; border: 0; cursor: pointer; border-radius: 16px; background: var(--mint); padding: 16px; font-family: inherit; font-size: calc(16.5px * var(--fs)); font-weight: 800; color: var(--ink); }
  #quick .q-go:disabled { opacity: 0.5; }
  #quick .q-other { width: 100%; margin-top: 10px; border: 0; background: none; cursor: pointer; font-family: inherit; font-size: calc(14.5px * var(--fs)); font-weight: 700; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; padding: 8px; }

  /* ───────── 앱 셸 ─────────
     헤더 v15 — 아이덴티티(민트칩 + 톱니)는 **전 화면 고정**, 그 아래 줄만 화면에 따라 바뀐다.
     홈 = 슬로건 + 행사 정보줄 / 그 밖 = 제목줄(상세는 뒤로가기). 헤더 끝은 민트 2px 선으로 본문과 분리 */
  #topbar { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 2px solid var(--mint); display: block; padding: 8px 12px 9px; }
  #topbar .h1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #topbar .tag { display: inline-block; background: var(--mint); color: var(--ink); font-family: var(--disp); font-size: 15px; letter-spacing: 0.045em; padding: 5px 11px 4px; border-radius: 9px; }
  #topbar .gear { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 11px; background: var(--white); color: var(--tx); cursor: pointer; padding: 0; }
  #topbar .gear:active { background: var(--surface2); }
  #topbar .gear svg { width: 20px; height: 20px; display: block; }
  #topbar .hsub { margin-top: 7px; text-align: left; font-size: calc(11.5px * var(--fs)); font-weight: 800; color: var(--muted); line-height: 1.4; }
  /* 홈 — 행사명 · 일시 · 장소 + 지오 모티프 */
  #topbar .h2 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  #topbar .h2 .nm { font-family: var(--disp); font-size: 13px; letter-spacing: 0.03em; color: var(--hi); }
  #topbar .h2 .dt { flex: 1; min-width: 96px; font-size: calc(12.5px * var(--fs)); font-weight: 800; color: var(--muted); line-height: 1.35; }
  #topbar .h2 .geo { flex: none; display: flex; align-items: center; gap: 5px; }
  #topbar .h2 .geo .disc { position: relative; width: 17px; height: 17px; border-radius: 999px; background: var(--blue); }
  #topbar .h2 .geo .disc::after { content: ""; position: absolute; inset: 5px; border-radius: 999px; background: var(--paper); }
  #topbar .h2 .geo .tri { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 11px solid var(--mint); }
  #topbar .h2 .geo .tri + .tri { margin-left: -4px; border-left-color: var(--mint-deep); }
  /* 홈 외 — 제목줄 (탭을 옮겨도 위쪽 아이덴티티는 그대로, 이 줄만 바뀐다) */
  #topbar .httl { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  #topbar .httl .back { flex: none; border: 0; background: none; font-size: 20px; font-weight: 800; color: var(--hi); cursor: pointer; width: 30px; height: 30px; margin-left: -6px; }
  #topbar .httl .title { flex: 1; min-width: 0; font-size: calc(16.5px * var(--fs)); font-weight: 800; color: var(--hi); line-height: 1.35; }
  #topbar .httl .chip { flex: none; padding: 5px 10px; font-size: calc(12.5px * var(--fs)); }
  #view { padding: 16px 16px 112px; min-height: calc(100dvh - 58px); }

  #tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 448px; z-index: 40; display: flex; background: rgba(19,21,25,0.97); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  #tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 8px; border: 0; background: none; cursor: pointer; font-size: calc(12.5px * var(--fs)); font-weight: 700; color: var(--faint); }
  #tabbar button .ico { width: 23px; height: 23px; display: flex; align-items: center; justify-content: center; color: var(--faint); }
  #tabbar button .ico svg { width: 23px; height: 23px; display: block; }
  #tabbar button.on { color: #fff; }
  #tabbar button.on .ico { color: #fff; }

  /* ───────── SK 배너 (홈 히어로) ───────── */
  .skb { margin-bottom: 16px; }
  .skb .r1 { background: #000; color: #fff; padding: 14px 16px 12px; border-radius: 14px; }
  .skb .r1 .big { font-family: var(--disp); font-size: 34px; letter-spacing: 0.02em; line-height: 1; }
  .skb .r2 { display: flex; gap: 6px; margin-top: 6px; }
  .skb .r2 .y { background: var(--mint); color: var(--ink); font-family: var(--disp); font-size: 26px; padding: 8px 14px 6px; line-height: 1; border-radius: 14px; }
  .skb .r2 .s { flex: 1; background: var(--mint); color: var(--ink); padding: 7px 12px 6px; display: flex; flex-direction: column; justify-content: center; border-radius: 14px; }
  .skb .r2 .s .t { font-family: var(--disp); font-size: calc(16.5px * var(--fs)); letter-spacing: 0.06em; }
  .skb .r2 .s .u { font-size: calc(11px * var(--fs)); font-weight: 800; letter-spacing: 0.02em; margin-top: 2px; }
  .skb .r3 { background: #000; color: #fff; margin-top: 6px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-radius: 14px; }
  .skb .r3 .d { font-family: var(--disp); font-size: calc(15.5px * var(--fs)); letter-spacing: 0.04em; line-height: 1.35; }
  .skb .r3 .geo { display: flex; align-items: center; gap: 8px; }
  .skb .r3 .disc { width: 30px; height: 30px; border-radius: 999px; background: var(--blue); position: relative; }
  .skb .r3 .disc::after { content: ""; position: absolute; inset: 9px; border-radius: 999px; background: #fff; }
  .skb .r3 .tri { width: 0; height: 0; border-top: 13px solid transparent; border-bottom: 13px solid transparent; border-left: 18px solid var(--mint); }
  .skb .r3 .tri + .tri { margin-left: -6px; border-left-color: var(--mint-deep); }

  /* ───────── 공용 컴포넌트 ───────── */
  .disp { font-family: var(--disp); letter-spacing: 0.02em; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .card.soft { border-color: transparent; }
  .mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; } .mt16 { margin-top: 16px; }
  .h3 { font-size: calc(16.5px * var(--fs)); font-weight: 800; color: var(--hi); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .h3::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--mint); }
  .sub-label { font-size: calc(14.5px * var(--fs)); font-weight: 800; color: var(--hi); margin: 18px 0 8px; }
  .muted { color: var(--muted); font-size: calc(14.5px * var(--fs)); line-height: 1.55; }
  .btn { display: block; width: 100%; border: 0; cursor: pointer; border-radius: 14px; padding: 13px; font-size: calc(15.5px * var(--fs)); font-weight: 800; color: var(--hi); background: var(--surface2); transition: transform 0.1s; }
  .btn:active { transform: scale(0.98); }
  .btn.mint { background: var(--mint); color: var(--ink); }
  .btn.line { background: transparent; color: var(--hi); border: 1px solid #3A3F46; }
  .btn.gray { background: #22252A; color: #767D87; }
  .btn:disabled { background: #22252A; color: #565C64; cursor: default; }
  .input { width: 100%; border-radius: 12px; border: 1px solid var(--line); padding: 12px 13px; font-size: calc(16.5px * var(--fs)); outline: none; background: var(--surface2); color: var(--tx); }
  .input:focus { border-color: var(--mint); }
  .input::placeholder { color: var(--faint); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge { display: inline-block; border-radius: 3px; padding: 3px 7px; font-size: calc(11.5px * var(--fs)); font-weight: 800; letter-spacing: 0.04em; }
  .badge.ink { background: #000; color: #fff; }
  .badge.mint { background: var(--mint); color: var(--ink); }
  .badge.blue { background: rgba(110,155,255,0.16); color: var(--blue); }
  .badge.tint { background: var(--tint); color: var(--mint); }
  .badge.gray { background: #2A2E33; color: #8A919B; }
  .kpi { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px; text-align: center; }
  .kpi .v { font-family: var(--disp); font-size: 24px; color: #fff; }
  .kpi.hot .v { color: var(--mint); }
  .kpi .l { margin-top: 3px; font-size: calc(12.5px * var(--fs)); font-weight: 700; color: var(--muted); line-height: 1.3; }
  /* Lv1 메뉴 카드 */
  .menu { background: var(--white); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .menu .mi { display: flex; align-items: center; gap: 13px; padding: 15px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .menu .mi:last-child { border-bottom: 0; }
  .menu .mi:active { background: var(--surface2); }
  .menu .mi .no { font-family: var(--disp); font-size: calc(16.5px * var(--fs)); color: var(--mint); width: 26px; }
  .menu .mi .tt { flex: 1; }
  .menu .mi .tt b { font-size: calc(16.5px * var(--fs)); color: var(--hi); }
  .menu .mi .tt p { font-size: calc(13.5px * var(--fs)); color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .menu .mi .arw { font-weight: 800; color: var(--faint); }
  .homegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .homegrid .hcell { background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 13px 14px; cursor: pointer; }
  .homegrid .hcell:active { background: var(--surface2); }
  .homegrid .hcell .no { font-family: var(--disp); font-size: calc(14.5px * var(--fs)); color: var(--mint); }
  .homegrid .hcell b { display: block; font-size: calc(15.5px * var(--fs)); color: var(--hi); margin-top: 4px; }

  .quiz-card { background: #101216; border: 1px solid var(--line); border-radius: 18px; padding: 18px; color: #fff; margin-bottom: 14px; }

  .quiz-wait { border: 1.5px dashed #3A3F46; border-radius: 18px; padding: 16px; text-align: center; background: var(--white); margin-bottom: 14px; }

  /* LED 전광판 공지 띠 — 검정 바탕에 민트 글자가 흐른다 */
  #ledbar { display: none; background: #000; overflow: hidden; white-space: nowrap; padding: 8px 0; border-top: 1px solid rgba(95,235,169,0.25); border-bottom: 1px solid rgba(95,235,169,0.25); }
  #ledbar .led-track { display: inline-block; padding-left: 100%; animation: ledflow 32s linear infinite; font-family: var(--disp); color: var(--mint); font-size: calc(15.5px * var(--fs)); letter-spacing: 0.08em; will-change: transform; }
  @keyframes ledflow { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  .wall { background: var(--ink); border-radius: 10px; padding: 16px; color: #fff; margin-bottom: 14px; }
  .wall .dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; margin-top: 12px; }
  .wall .dots span { aspect-ratio: 1; background: rgba(255,255,255,0.12); }
  .wall .dots span.lit { background: var(--mint); }
  .wall .dots span:nth-child(7n).lit { border-radius: 999px; background: var(--blue); }
  .wall .dots span:nth-child(11n).lit { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .tl { position: relative; margin-left: 10px; border-left: 2px solid var(--line); list-style: none; }
  .tl li { position: relative; padding: 0 0 18px 20px; }
  .tl li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 999px; background: var(--paper); border: 2px solid #3A3F46; }
  .tl li.now::before { background: var(--mint); border-color: var(--mint); }
  .stamp5 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stamp5 .cell { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 14px; background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px; color: var(--tx); }
  .stamp5 .cell.got { background: var(--mint); color: var(--ink); border-color: var(--mint); }
  .stamp5 .cell .n { font-family: var(--disp); font-size: calc(16.5px * var(--fs)); }
  .stamp5 .cell .t { font-size: calc(10px * var(--fs)); font-weight: 700; text-align: center; line-height: 1.25; color: var(--muted); }
  .stamp5 .cell.got .t { color: rgba(11,12,14,0.75); }
  .stamp5 .cell.got .n { color: var(--ink); }
  .coupon { border-radius: 18px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--line); }
  .coupon .head { background: var(--mint); color: var(--ink); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .coupon .head b { font-size: calc(15.5px * var(--fs)); }
  .coupon .body { background: var(--white); padding: 14px 16px; }
  .coupon.used .head { background: #2A2E33; color: #8A919B; }
  .coupon.locked .head { background: var(--white); color: var(--hi); border-bottom: 1.5px dashed #3A3F46; }
  .qrbox { display: grid; grid-template-columns: repeat(17, 1fr); gap: 1px; width: 150px; margin: 10px auto; background: #fff; padding: 8px; border: 1px solid #3A3F46; border-radius: 10px; }
  .qrbox span { aspect-ratio: 1; background: #fff; }
  .qrbox span.b { background: #0B0C0E; }
  .coupon.used .qrbox { opacity: 0.25; }
  .floor { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 10px; background: var(--white); }
  .floor .fhead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .floor .fhead .no { font-family: var(--disp); font-size: 28px; line-height: 1; }
  .floor .fhead .role { font-size: calc(16.5px * var(--fs)); font-weight: 800; }
  .floor .fhead .en { margin-left: auto; font-family: var(--disp); font-size: calc(12.5px * var(--fs)); letter-spacing: 0.14em; opacity: 0.75; }
  .floor .fbody { padding: 12px 16px; border-top: 1px solid var(--line); font-size: calc(15.5px * var(--fs)); line-height: 1.8; color: var(--tx); }
  .floor.f-ink .fhead { background: #000; color: #fff; }
  .floor.f-ink .fhead .no { color: var(--mint); }
  .floor.f-mint .fhead { background: var(--mint); color: var(--ink); }
  .floor.f-blue .fhead { background: #182339; color: #D7E3FF; }
  .floor.f-blue .fhead .no { color: var(--blue); }
  .floor.f-wh .fhead { background: var(--surface2); color: var(--hi); }
  .rank { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .rank .no { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-family: var(--disp); font-size: calc(14.5px * var(--fs)); background: #2A2E33; color: #8A919B; border-radius: 8px; }
  .rank.top .no { background: var(--mint); color: var(--ink); }
  .tag-btn { border: 1px solid var(--line); cursor: pointer; border-radius: 10px; background: var(--surface2); color: var(--muted); padding: 7px 12px; font-size: calc(14.5px * var(--fs)); font-weight: 700; }
  .tag-btn.on { background: var(--mint); color: var(--ink); border-color: var(--mint); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; background: var(--white); }
  .seg button { flex: 1; border: 0; cursor: pointer; background: none; padding: 9px 0; font-size: calc(12.5px * var(--fs)); font-weight: 800; color: var(--muted); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: #F2F4F6; color: #0B0C0E; }
  #toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(20px); z-index: 90; background: #101216; color: #fff; font-size: calc(14.5px * var(--fs)); font-weight: 700; padding: 12px 20px; border-radius: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; max-width: 88%; text-align: center; border: 1px solid var(--mint); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 미니게임 */
  .game-hud { display: flex; gap: 8px; margin-bottom: 12px; }
  .game-hud .hud { flex: 1; background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 9px 6px; text-align: center; }
  .game-hud .hud .v { font-family: var(--disp); font-size: 20px; color: #fff; }
  .game-hud .hud .v.hot { color: #e11d48; }
  .game-hud .hud .l { font-size: calc(11.5px * var(--fs)); font-weight: 700; color: var(--muted); margin-top: 2px; }
  .chain-box { background: #101216; border: 1px solid var(--line); color: #fff; border-radius: 18px; padding: 18px; text-align: center; margin-bottom: 12px; }
  .chain-box .who { font-size: calc(12.5px * var(--fs)); font-weight: 800; letter-spacing: 0.08em; color: #9aa3b2; }
  .chain-box .word { font-size: 27px; font-weight: 800; margin-top: 5px; }
  .chain-box .next { margin-top: 8px; font-size: calc(14.5px * var(--fs)); opacity: 0.9; }
  .chain-box .next b { color: var(--mint); font-size: calc(16.5px * var(--fs)); }
  .gmsg { min-height: 18px; font-size: calc(14.5px * var(--fs)); font-weight: 700; color: #e11d48; margin-top: 6px; }
  @keyframes popIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.9); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
  /* 게임 A 「AX 링크」 — 끝말 타일 연결 → 문장 완성 */
  .sline { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; background: #101216; border: 1px solid var(--line); border-radius: 16px; padding: 13px 12px; margin-bottom: 12px; }
  .sline .cap { width: 100%; text-align: center; font-size: calc(12.5px * var(--fs)); font-weight: 800; letter-spacing: 0.1em; color: var(--faint); margin-bottom: 2px; }
  .sblock { padding: 7px 10px; border-radius: 8px; background: var(--surface2); color: var(--faint); font-weight: 800; font-size: calc(15.5px * var(--fs)); letter-spacing: 0.06em; }
  .sblock.fill { background: var(--mint); color: var(--ink); letter-spacing: 0; }
  .sblock.pop { animation: blockPop 0.35s ease-out; }
  @keyframes blockPop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  .lgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ltile { position: relative; border: 1px solid var(--line); background: var(--white); border-radius: 12px; padding: 14px 0; text-align: center; font-weight: 800; font-size: calc(16.5px * var(--fs)); color: var(--tx); cursor: pointer; }
  .ltile:active { transform: scale(0.97); }
  .ltile.used { background: var(--tint); border-color: var(--tint2); color: var(--mint); cursor: default; }
  .ltile.used .ord { position: absolute; top: -7px; right: -5px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--mint); color: var(--ink); font-family: var(--disp); font-size: calc(12.5px * var(--fs)); display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .ltile.wrong { border-color: #FF6B61; background: rgba(255,107,97,0.12); animation: tileShake 0.4s; }
  @keyframes tileShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .ltile.hint { animation: hintPulse 1s ease-in-out infinite; }
  @keyframes hintPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(95,235,169,0); } 50% { box-shadow: 0 0 0 4px rgba(95,235,169,0.35); } }
  .cho-box { background: #101216; border: 1px solid var(--line); color: #fff; border-radius: 18px; padding: 22px 18px; text-align: center; margin-bottom: 12px; }
  .cho-box .cho { font-family: var(--disp); font-size: 32px; letter-spacing: 0.18em; color: var(--mint); }
  .cho-box .hint { margin-top: 10px; font-size: calc(15.5px * var(--fs)); line-height: 1.65; opacity: 0.92; }
  .gfeed { min-height: 22px; text-align: center; font-size: calc(15.5px * var(--fs)); font-weight: 800; margin-top: 8px; }
  .gfeed.ok { color: #4ADE80; } .gfeed.no { color: #FF6B61; }

  /* ── v10: 과제상담 (DAP ZONE) — 앱 공통 다크·민트 토큰만 사용 (레퍼런스 네이비·오렌지 금지) ── */
  .slotgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot { border: 1px solid var(--line); background: var(--white); border-radius: 10px; padding: 11px 0; text-align: center; font-weight: 800; font-size: calc(15.5px * var(--fs)); color: var(--tx); cursor: pointer; }
  .slot.on { background: var(--mint); border-color: var(--mint); color: var(--ink); }
  .slot.off { background: #1A1D22; color: #4A5058; cursor: default; border-color: transparent; }
  .lunchbar { grid-column: 1 / -1; background: #1A1D22; color: #565C64; text-align: center; padding: 10px 0; border-radius: 10px; font-size: calc(14.5px * var(--fs)); font-weight: 700; }
  .rstep { display: flex; gap: 5px; margin-top: 14px; }
  .rstep span { flex: 1; text-align: center; font-size: calc(11.5px * var(--fs)); font-weight: 800; padding: 8px 0; border-radius: 8px; background: var(--surface2); color: var(--faint); }
  .rstep span.done { background: var(--tint); color: var(--mint); }
  .rstep span.on { background: var(--mint); color: var(--ink); }
  /* 공용 모달 */
  #modal { position: fixed; inset: 0; z-index: 96; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.62); padding: 24px; }
  #modal .mcard { width: 100%; max-width: 360px; max-height: 82dvh; overflow-y: auto; background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 20px; position: relative; animation: popIn 0.25s ease-out; }
  #modal .mx { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; width: 36px; height: 36px; }
  .tlstep { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .tlstep .pill { min-width: 78px; text-align: center; font-family: var(--disp); font-size: calc(14.5px * var(--fs)); padding: 8px 0; border-radius: 999px; background: var(--surface2); color: var(--mint); }
  .tlstep .tx2 { font-size: calc(15.5px * var(--fs)); font-weight: 700; color: var(--tx); line-height: 1.45; }
  .tipbanner { margin-top: 16px; background: var(--tint); border: 1.5px solid var(--tint2); color: var(--mint); border-radius: 12px; padding: 11px 14px; font-size: calc(14.5px * var(--fs)); font-weight: 800; text-align: center; line-height: 1.5; }
  /* DAP Wall QR 퀴즈 */
  .wopt { display: block; width: 100%; text-align: left; margin-top: 7px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); color: var(--tx); padding: 11px 13px; font-size: calc(15.5px * var(--fs)); font-weight: 600; cursor: pointer; }
  .wopt.on { border-color: var(--mint); background: var(--tint); color: var(--mint); font-weight: 800; }
  .seg.wide { overflow-x: auto; }
  /* 글자를 키우면 탭이 폭을 넘기므로 가로 스크롤로 (숨기면 마지막 탭을 누를 수 없다) */
  .seg.wide { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .seg.wide::-webkit-scrollbar { display: none; }
  .seg.wide button { flex: none; padding: 9px 13px; white-space: nowrap; }
  /* 사이니지 공통 (프로토타입 — 실물은 화면별 전용 레이아웃) */
  .sg { color: #fff; padding: 6px 0 24px; }
  .sg .sg-title { font-family: var(--disp); font-size: 22px; letter-spacing: 0.03em; }
  .sg .sg-sub { font-size: calc(12.5px * var(--fs)); font-weight: 700; letter-spacing: 0.1em; opacity: 0.55; margin-top: 2px; }

  /* ME to WE 라이브 월 */
  .mt-stage { position: relative; margin-top: 12px; border-radius: 18px; background: #05070B center/cover no-repeat; border: 1px solid var(--line); overflow: hidden; height: 54vh; min-height: 330px; }

  .mt-count { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }

  .mt-steps span.hit { border: 1px solid var(--mint); background: rgba(95,235,169,0.12); color: var(--mint); opacity: 1; }
  .mt-tick { margin-top: 12px; font-size: calc(14.5px * var(--fs)); font-weight: 700; opacity: 0.7; text-align: center; min-height: 18px; }

  .mt-demo .lb { flex-basis: 100%; text-align: center; font-size: calc(11.5px * var(--fs)); font-weight: 800; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); }
  .mt-demo button { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.22); color: rgba(255,255,255,0.85); font-family: inherit; font-size: calc(14.5px * var(--fs)); font-weight: 800; padding: 8px 13px; border-radius: 999px; cursor: pointer; }
  .mt-demo button.on { background: var(--mint); border-color: var(--mint); color: var(--ink); }
  /* 홈 LIVE 섹션 — 미니 월 · 이벤트 현황 · 랭킹 · 혼잡도 */
  .mw-live { position: absolute; top: 12px; left: 14px; display: flex; align-items: center; gap: 7px; font-size: calc(12.5px * var(--fs)); font-weight: 800; letter-spacing: 0.08em; color: var(--mint); background: rgba(11,13,17,0.55); border-radius: 999px; padding: 5px 11px; }
  .mw-live i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a4e; animation: pulse 1.2s infinite; }
  /* ═══════ 홈 v12 — 상시 블록은 6개까지 (조건부 블록은 나에게 해당될 때만) ═══════ */
  .hgreet { margin-bottom: 12px; font-size: calc(15.5px * var(--fs)); font-weight: 700; color: var(--muted); line-height: 1.5; }
  .hgreet b { color: var(--hi); font-weight: 800; }
  /* 지금 진행 중 */
  .nowcard { background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
  .nowcard .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nowcard .live { display: flex; align-items: center; gap: 7px; font-size: calc(12.5px * var(--fs)); font-weight: 800; letter-spacing: 0.06em; color: var(--mint); }
  .nowcard .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: pulse 1.6s infinite; }
  .nowcard .when { font-family: var(--disp); font-size: calc(14.5px * var(--fs)); color: var(--muted); letter-spacing: 0.03em; }
  .nowcard .ttl { margin-top: 11px; font-size: calc(19px * var(--fs)); font-weight: 800; color: var(--hi); line-height: 1.35; letter-spacing: -0.01em; }
  .nowcard .place { margin-top: 6px; font-size: calc(14.5px * var(--fs)); font-weight: 800; color: var(--mint); }
  .nowcard .desc { margin-top: 9px; font-size: calc(13.5px * var(--fs)); line-height: 1.65; color: var(--muted); }
  .nowcard .next { display: flex; align-items: center; gap: 10px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line); }
  .nowcard .next .lb { font-size: calc(12.5px * var(--fs)); font-weight: 800; color: var(--faint); }
  .nowcard .next .tm { font-family: var(--disp); font-size: calc(15.5px * var(--fs)); color: var(--hi); }

var WQ = { set: null };

  wqAttempts(setId).forEach(function (a) { if (!best || a.score > best.score) best = a; });
  return best;
}
function wqPassedCount() {
  var n = 0;

  return n;
}
function shuf(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  if (!S.get("dept", null)) {
    App.go("wq_list");

function wqStart(setId) {
  var def = wqSets().find(function (s) { return s.id === setId; });
  if (!def) return false;
  if (!wqActive(setId)) { toast("이 세트는 지금 점검 중이에요."); return false; }
  var qs = def.qs.map(function (q) {
    var idx = q.o.map(function (_, i) { return i; });
    shuf(idx);
    return { q: q.q, o: idx.map(function (i) { return q.o[i]; }), a: idx.indexOf(q.a) };
  });
  shuf(qs);

  return true;
}

  var correct = 0;
  WQ.qs.forEach(function (q, i) { if (WQ.picks[i] === q.a) correct++; });
  var score = Math.round((correct / WQ.qs.length) * 100);
  var passed = score >= wqPassScore();
  var prevBest = wqBest(WQ.set);
  var firstPass = passed && !(prevBest && prevBest.passed);
  var at = S.get("wq_attempts", []);
  at.push({ set: WQ.set, score: score, passed: passed, attemptNo: wqAttempts(WQ.set).length + 1, dept: S.get("dept", null) || "미지정", ts: Date.now() });

/* LED 공지 띠 — 최신 공지(30분 이내)를 전광판처럼 흘린다. 같은 공지면 애니메이션 유지 */
var LED_TTL = 30 * 60000;
function updateLed() {
  var bar = el("ledbar"), tr = el("ledTrack");
  if (!bar || !tr) return;
  if (SIGNAGE.indexOf(App.current) >= 0 || App.current === "game_word" || App.current === "game_cho") { bar.style.display = "none"; return; }
  var ns = S.get("notices", []);
  var latest = null;
  for (var i = 0; i < ns.length; i++) {
    if (ns[i] && ns[i].ts > 0 && Date.now() - ns[i].ts < LED_TTL) { latest = ns[i]; break; }
  }
  if (!latest) { bar.style.display = "none"; tr.dataset.nid = ""; return; }
  bar.style.display = "block";
  if (tr.dataset.nid !== latest.id) {
    tr.dataset.nid = latest.id;
    tr.textContent = "\u25cf " + latest.title + " — " + latest.body + "   \u25cf " + latest.title + " — " + latest.body;
  }
}
setInterval(updateLed, 30000);

  checkMyState();
  updateLed();
  if (["game_word", "game_cho", "wall_wave", "wall_metowe"].indexOf(App.current) >= 0) return;
  App.render();
});

    '</div><p class="q">' + esc(quiz.question) + "</p>";

function answerQuiz(qid, choice) {
  var quiz = QUIZZES.find(function (q) { return q.id === qid; });
  var answers = S.get("quiz_answers", {});

  answers[qid] = { choice: choice, correct: choice === quiz.answerIndex, replay: false, ts: Date.now() };

  awardStamp("p4");
}

  var quiz = QUIZZES.find(function (q) { return q.id === qid; });

  /* ── v10 【신규 A】 과제상담 신청 — 구성은 v5 p25 목업, 룩은 앱 공통 다크·민트 ── */

      var steps = ["신청", "승인", "체크인", "상담", "사은품"];
      return '' +
        hero('<p class="disp" style="margin-top:12px;font-size:36px">' + my.slot + "</p>" +

          my.status === "approved" ?
          '<div class="card soft"><p class="muted">승인 완료 — 시작 5분 전까지 1F Meeting Room 2 앞에서 체크인해주세요. 시작 10분 경과 시 노쇼 처리됩니다.</p>' +

          '<div class="coupon"><div class="head"><b>사은품 교환권 — 상담 완료</b><span class="badge ink">1회</span></div>' +
          '<div class="body">' + qrHtml() +
          '<p style="text-align:center;font-size:calc(14.5px * var(--fs));font-weight:800;letter-spacing:0.06em;color:var(--hi)">GIFT-' + esc(S.get("user", {}).empId || "") + "</p>" +
          '<p class="muted" style="margin-top:8px;text-align:center;font-size:calc(13.5px * var(--fs))">DAP Zone 데스크에서 확인 후 수령 — 중복 수령 방지 코드예요.</p></div></div>' +
          '<div class="card soft mt16"><p class="muted">상담에서 나온 실행 과제를 제출하면 별도 심사·시상 대상이 됩니다. 아이디어 탭에서 이어서 적어보세요.</p></div>');
    }
    var morning = slots.filter(function (s) { return t2m(s) < lunchM; });
    var afternoon = slots.filter(function (s) { return t2m(s) >= lunchM; });
    var cell = function (s) {
      var off = resvTaken(s);
      return '<button class="slot' + (off ? " off" : DAPSEL === s ? " on" : "") + '"' + (off ? "" : ' onclick="dapPick(\'' + s + '\')"') + ">" + s + "</button>";
    };
    return '' +
      (my && my.status === "noshow" ? '<div class="card soft mb12"><p style="font-size:calc(14.5px * var(--fs));color:#FF6B61;font-weight:700">이전 예약이 노쇼 처리됐어요 — 아래에서 다시 신청할 수 있습니다.</p></div>' :
       my && my.status === "canceled" ? '<div class="card soft mb12"><p style="font-size:calc(14.5px * var(--fs));color:#FF6B61;font-weight:700">이전 신청이 취소되었습니다 — 아래에서 다시 신청할 수 있습니다.</p></div>' : "") +
      hero('<p style="margin-top:10px;font-size:calc(19px * var(--fs));font-weight:800;line-height:1.45">내 업무에 AI를 어떻게 적용할지,<br><span style="color:var(--mint)">30분 1:1 과제상담</span></p>' +
        '<p class="muted" style="margin-top:6px;font-size:calc(14.5px * var(--fs))">데이터사이언스파트(DAP)와 마주 앉아 업무 설명 → 병목 → 개선방안까지. 상담을 완료하면 사은품을 드려요.</p>') +

      '<div class="slotgrid">' + morning.map(cell).join("") +
      '<div class="lunchbar">점심시간</div>' + afternoon.map(cell).join("") + "</div>" +
      '<p style="margin-top:12px;font-size:calc(12.5px * var(--fs));color:var(--faint);line-height:1.6">미팅룸 ② 당일 신청 전용 (잔여 ' + resvRemain() + '석) · 사전신청(미팅룸 ①)은 마감</p>' +
      '<button class="btn mint" style="margin-top:12px;padding:15px"' + (DAPSEL ? ' onclick="bookResv()"' : " disabled") + ">상담 신청하기" + (DAPSEL ? " — " + DAPSEL : "") + "</button>";
  },

  wq_list: function () {
    var dept = S.get("dept", null);
    var pass = wqPassScore();
    var deptCard = dept ?
      '<div class="row mb12" style="justify-content:space-between"><span style="font-size:calc(14.5px * var(--fs));font-weight:700;color:var(--muted)">우리 부문: <b style="color:var(--mint)">' + esc(dept) + '</b> — 정답률 경쟁 반영 중</span><button class="tag-btn" onclick="S.set(\'dept\', null)">변경</button></div>' :
      '<div class="card mb12" style="border-color:var(--mint-deep)"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">부문 선택 — 시작 전 1번만</b><p class="muted" style="margin-top:3px;font-size:calc(13.5px * var(--fs))">Special Wall 스크린의 부문별 정답률 경쟁에 반영돼요.</p>' +
      '<div class="row" style="flex-wrap:wrap;margin-top:10px">' + DEPTS.map(function (d) {
        return '<button class="tag-btn" onclick="pickDept(\'' + d + '\')">' + d + "</button>";
      }).join("") + "</div></div>";
    var setCards = wqSets().map(function (s, i) {
      var best = wqBest(s.id);
      var badge = !wqActive(s.id) ? '<span class="badge gray">점검 중</span>' :
        best && best.passed ? '<span class="badge mint">통과 ' + best.score + "점</span>" :
        best ? '<span class="badge blue">최고 ' + best.score + "점</span>" : '<span class="badge gray">미응시</span>';
      return '<div class="card mb8" style="display:flex;align-items:center;gap:12px;cursor:pointer" onclick="wqOpen(\'' + s.id + '\')">' +
        '<span class="disp" style="font-size:calc(15.5px * var(--fs));color:var(--hi);border:1px solid var(--line);border-radius:4px;padding:6px 8px">QR ' + (i + 1) + "</span>" +
        '<div style="flex:1"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">' + esc(s.name) + '</b><p class="muted" style="font-size:calc(13.5px * var(--fs));margin-top:2px">' + esc(s.theme) + "</p></div>" + badge + "</div>";
    }).join("");
    /* 부문 정답률 랭킹 — 홈에 있던 블록을 집계의 출처인 이 화면으로 (1F Special Wall 사이니지와 같은 수치) */
    var rows = deptStats(), myIdx = -1;
    for (var ri = 0; ri < rows.length; ri++) if (rows[ri].d === dept) { myIdx = ri; break; }
    var rrow = function (r, idx, dim) {
      return '<div class="rrow' + (dim ? " dim" : "") + '"><span class="rno' + (idx === 0 ? " g" : "") + '">' + (idx + 1) + "</span>" +
        '<span class="rname' + (r.d === dept ? " me" : "") + '">' + esc(r.d) + "</span>" +
        '<span class="rbar"><i style="width:' + Math.round(r.avg / Math.max(1, rows[0].avg) * 100) + '%"></i></span>' +
        '<b class="disp rv">' + r.avg + "</b></div>";
    };
    var rankCard = !rows.length ? "" :
      '<div class="card mt16" style="padding:15px 16px">' +
      '<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px">' +
      '<b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">부문 정답률 랭킹</b>' +
      '<span style="font-size:calc(12.5px * var(--fs));color:var(--faint)">100점 만점</span></div>' +
      rows.slice(0, 3).map(function (r, i) { return rrow(r, i, false); }).join("") +
      ((dept && myIdx >= 3) ? rrow(rows[myIdx], myIdx, true) : "") +
      '<p style="margin-top:9px;font-size:calc(12.5px * var(--fs));color:var(--faint);line-height:1.55">지금 문제를 풀면 우리 부문 점수가 올라갑니다 — 1F Special Wall 화면과 같은 집계예요.</p></div>';

      '<div class="card soft mt16"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">참여 방법</b>' +
      '<p class="muted" style="margin-top:6px;font-size:calc(14.5px * var(--fs));line-height:1.8">① 1F DAP Wall·Special Wall의 QR 발견 → ② 스캔하면 5문항 오픈 → ③ 정답은 벽 전시 안에서 탐색 → ④ 평균 <b style="color:var(--mint)">' + pass + '점 이상</b> 즉석경품 응모권 → ⑤ 이벤트존에서 즉석 추첨!</p>' +
      '<p class="muted" style="margin-top:6px;font-size:calc(13.5px * var(--fs))">' + pass + '점 미만은 <b>무제한 재응시</b> (문항·보기 순서가 바뀌어요) · 3세트 모두 통과 = 보너스 응모권 + 가중치 100P · 키노트 라이브 퀴즈와는 별개예요. 테스트 버전은 QR 없이 세트를 바로 열 수 있습니다.</p></div>';
  },

  wq_play: function () {
    if (!WQ.set) {
      return '<div class="card soft" style="text-align:center"><p class="muted">세트를 선택하면 문항이 열립니다.</p>' +
        '<button class="btn mint" style="margin-top:12px" onclick="App.go(\'wq_list\')">세트 고르러 가기</button></div>';
    }
    if (WQ.submitted) {
      var r = WQ.result;
      var entryN = S.get("entries", []).length;
      return '<div class="cho-box" style="padding:26px 18px"><p style="font-size:calc(12.5px * var(--fs));font-weight:800;letter-spacing:0.08em;color:#9aa3b2">' + esc(WQ.name) + " · " + WQ.qs.length + '문항</p>' +
        '<p class="disp" style="font-size:44px;margin-top:6px;color:' + (r.passed ? "var(--mint)" : "#FF6B61") + '">' + r.score + '점</p>' +
        '<p class="hint">' + (r.passed ? "통과! (" + r.correct + "/" + WQ.qs.length + " 정답 · 커트라인 " + wqPassScore() + "점)" :
          r.correct + "/" + WQ.qs.length + " 정답 — 커트라인 " + wqPassScore() + "점. 정답은 전부 1F 벽에 있어요. 다시 도전!") + "</p></div>" +
        (r.passed ? '<div class="card mb8" style="border-color:var(--mint-deep)"><p style="font-size:calc(14.5px * var(--fs));color:var(--tx)">응모권 지갑: <b style="color:var(--mint)">' + entryN + '장</b> — 1F 이벤트존 즉석 추첨(가챠)에서 사용하세요.</p></div>' : "") +
        '<button class="btn mint mb8" style="padding:15px" onclick="wqRetry(\'' + WQ.set + '\')">' + (r.passed ? "한 번 더 (기록 갱신)" : "재응시 — 순서 셔플") + "</button>" +
        '<button class="btn line" onclick="App.go(\'wq_list\')">세트 목록으로</button>';
    }
    var n = Object.keys(WQ.picks).length;
    return '<div class="card soft mb12" style="padding:12px 14px"><div class="row" style="justify-content:space-between"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">' + esc(WQ.name) + " — " + esc(WQ.theme) + '</b><span class="badge tint">' + n + "/" + WQ.qs.length + "</span></div>" +
      '<p class="muted" style="font-size:calc(12.5px * var(--fs));margin-top:3px">시간 제한 없음 · 정답은 1F 벽 전시 안에 있어요</p></div>' +
      WQ.qs.map(function (q, qi) {
        return '<div class="card mb8"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi);line-height:1.5">Q' + (qi + 1) + ". " + esc(q.q) + "</b>" +
          q.o.map(function (o, oi) {
            return '<button class="wopt' + (WQ.picks[qi] === oi ? " on" : "") + '" onclick="wqPick(' + qi + "," + oi + ')">' + esc(o) + "</button>";
          }).join("") + "</div>";
      }).join("") +
      '<button class="btn mint" style="padding:15px;margin-top:4px" onclick="wqSubmit()">제출하고 채점 (' + n + "/" + WQ.qs.length + ")</button>";
  },

  entries: function () {
    var e = S.get("entries", []);
    if (!e.length) {
      return '<div class="card soft" style="text-align:center"><p class="muted">아직 응모권이 없어요.<br>DAP Wall QR 퀴즈에서 ' + wqPassScore() + '점 이상이면 1장!</p>' +
        '<button class="btn mint" style="margin-top:12px" onclick="App.go(\'wq_list\')">QR 퀴즈 풀러 가기</button></div>';
    }
    return e.slice().reverse().map(function (x) {
      var label = x.source === "bonus" ? "3세트 완주 보너스" : "QR 퀴즈 통과 (" + (x.set || "") + ")";
      return '<div class="coupon mb8"><div class="head"><b>즉석경품 응모권</b><span class="badge ink">' + esc(label) + "</span></div>" +
        '<div class="body"><p style="text-align:center;font-family:var(--disp);font-size:26px;letter-spacing:0.1em;color:var(--hi)">' + esc(x.code) + "</p>" +
        '<p class="muted" style="margin-top:6px;text-align:center;font-size:calc(13.5px * var(--fs))">1F 이벤트존 부스에 보여주면 즉석 추첨(가챠) 1회 — ' + fmtTime(x.ts) + "</p></div></div>";
    }).join("") +
      '<div class="card soft mt16"><p class="muted" style="font-size:calc(13.5px * var(--fs))">응모 경로는 2개 — <b>패스포트 완주(경로 5개)</b>는 17:00 대형경품 추첨, <b>QR 퀴즈 응모권</b>은 현장 즉석 추첨이에요.</p></div>';
  },

      '<div class="row" style="gap:6px">' + tvBtns() + '<button class="chip" style="background:rgba(255,255,255,0.08);color:#fff;border-color:rgba(255,255,255,0.3);white-space:nowrap" onclick="App.go(\'admin\')">← 콘솔</button></div></div>' +

      '<div class="row" style="gap:6px">' + tvBtns() + '<button class="chip" style="background:rgba(255,255,255,0.08);color:#fff;border-color:rgba(255,255,255,0.3);white-space:nowrap" onclick="App.go(\'admin\')">← 콘솔</button></div></div>' +
      '<div style="margin-top:12px;height:150px;border-radius:16px;overflow:hidden;background:#001F5B;position:relative">' +

        return '<div><div class="v">' + x[1].toLocaleString() + '</div><div class="l">' + x[0] + "</div></div>";
      }).join("") + "</div></div>" +
      '<p style="font-size:calc(13.5px * var(--fs));font-weight:800;letter-spacing:0.08em;color:var(--mint);margin-top:4px">지금 올라온 아이디어 — 운영자 승인분</p>' +
      feed.map(function (f) {

      }).join("") +

  admin: function () {

        '<button class="btn" style="max-width:280px" onclick="tryAdmin()">확인</button>' +
        "</div>";

/* ── 인앱 QR 스캔 — BarcodeDetector(안드로이드 크롬). 미지원 기기는 기본 카메라로 QR을 찍는 기존 경로 ── */

    '<p class="disp" style="font-size:34px;color:' + (cleared ? "var(--mint)" : "#9aa3b2") + '">' + (allDone ? "ALL CLEAR!" : cleared ? "CLEAR!" : "TIME UP") + "</p>" +
    '<p class="next" style="margin-top:8px">' + GW.score + "점 · 문장 " + GW.done.length + "/" + LINK_ROUNDS.length + " 완성 · 최고 " + S.get("gw_best", 0) + '점</p>' +
    (cleared ? '<p style="margin-top:8px;font-size:calc(14.5px * var(--fs));opacity:0.9">클리어 보상 +' + GAME_POINTS + "P (최초 1회)" + (allDone ? " · 완주 보너스 +남은 시간" : "") + "</p>" :
      '<p style="margin-top:8px;font-size:calc(14.5px * var(--fs));opacity:0.9">문장 1개만 완성해도 클리어! 6초 헤매면 정답이 반짝여요.</p>') + "</div>" +
    doneList +
    '<button class="btn mint mb8" style="padding:15px" onclick="gwStart()">다시 도전</button>' +
    '<button class="btn line" onclick="App.go(\'ev_games\')">미니게임으로</button>';
}

/* ════════════════ 게임 B: 로드맵 초성퀴즈 ════════════════ */
var GC = { i: 0, correct: 0, active: false };
function gcStart() {
  GC = { i: 0, correct: 0, active: true };
  gcPaint();
}
function gcPaint(feed, feedOk) {
  var root = el("gcRoot"); if (!root) return;
  if (GC.i >= CHOSEONG_QUIZ.length) { gcEnd(); return; }
  var q = CHOSEONG_QUIZ[GC.i];
  root.innerHTML =
    '<div class="game-hud">' +
    '<div class="hud"><div class="v">' + (GC.i + 1) + "/" + CHOSEONG_QUIZ.length + '</div><div class="l">문제</div></div>' +
    '<div class="hud"><div class="v">' + GC.correct + '</div><div class="l">맞힌 개수 (목표 ' + GC_PASS + ')</div></div></div>' +
    '<div class="cho-box"><p style="font-size:calc(12.5px * var(--fs));font-weight:800;letter-spacing:0.08em;color:#9aa3b2">Q' + (GC.i + 1) + "</p>" +
    '<p class="cho">' + esc(q.cho) + '</p><p class="hint">' + esc(q.hint) + "</p></div>" +
    '<div class="gfeed' + (feedOk === true ? " ok" : feedOk === false ? " no" : "") + '">' + (feed || "") + "</div>" +
    '<div class="row" style="margin-top:4px"><input id="gcInput" class="input" placeholder="정답 입력" autocomplete="off" onkeydown="if(event.key===\'Enter\')gcSubmit()">' +
    '<button class="btn mint" style="width:auto;padding:12px 18px" onclick="gcSubmit()">제출</button></div>' +
    '<button class="btn line" style="margin-top:8px" onclick="gcSkip()">모르겠어요 (넘기기)</button>';
  var inp = el("gcInput"); if (inp) inp.focus();
}
function gcNorm(s) { return String(s || "").trim().toLowerCase().replace(/\s+/g, ""); }
function gcSubmit() {
  if (!GC.active) return;
  var q = CHOSEONG_QUIZ[GC.i];
  var v = gcNorm(el("gcInput") && el("gcInput").value);
  if (!v) return;
  var ok = v === gcNorm(q.a) || q.alts.some(function (a) { return v === gcNorm(a); });
  if (ok) GC.correct++;
  GC.i++;
  gcPaint(ok ? "정답! — " + q.a : "아쉽! 정답은 「" + q.a + "」", ok);
}
function gcSkip() {
  if (!GC.active) return;
  var q = CHOSEONG_QUIZ[GC.i];
  GC.i++;
  gcPaint("정답은 「" + q.a + "」 — 다음 문제!", false);
}
function gcEnd() {
  GC.active = false;
  var cleared = GC.correct >= GC_PASS;
  var root = el("gcRoot"); if (!root) return;
  root.innerHTML =
    '<div class="cho-box" style="padding:28px 18px">' +
    '<p class="disp" style="font-size:34px;color:' + (cleared ? "var(--mint)" : "#9aa3b2") + '">' + (cleared ? "CLEAR!" : GC.correct + "/8") + "</p>" +
    '<p style="font-size:20px;font-weight:800;margin-top:8px">' + GC.correct + "/" + CHOSEONG_QUIZ.length + " 정답</p>" +
    '<p class="hint">' + (cleared ? "추첨 가중치 +" + GAME_POINTS + "P! 힌트 속 로드맵, 이제 눈에 익으셨죠?" : "목표는 " + GC_PASS + "개 — 힌트 속에 로드맵이 다 들어있어요. 한 번 더?") + "</p></div>" +
    '<button class="btn mint mb8" style="padding:15px" onclick="gcStart()">다시 풀기</button>' +
    '<button class="btn line" onclick="App.go(\'ev_games\')">미니게임으로</button>';
  if (cleared) gameClear("gc_cleared");
}

/* ════════════════ 스플래시 → 앱 진입 ════════════════ */
(function () {
  var splash = el("splash");
  var intro = el("introV");
  var loop = el("loopV");
  var chime = el("chime");
  var chimeTimer = null;
  var CHIME_DELAY_MS = 500;

  var mediaReady = Promise.all([intro, loop, chime].map(function (m) {
    return fetch(m.src).then(function (r) { return r.blob(); })
      .then(function (b) { m.src = URL.createObjectURL(b); }).catch(function () {});
  }));

  function setPhase(p) { splash.dataset.phase = p; }
  function enterApp() {
    splash.classList.add("gone");
    el("frame").classList.remove("splash-mode");
    el("app").hidden = false;
    try { intro.pause(); loop.pause(); } catch (e) {}
    /* 글자 크기를 한 번도 고른 적 없으면, 그런 기능이 있다는 것만 조용히 알린다 (1회) */
    try {
      if (!localStorage.getItem(LS_FS)) setTimeout(function () {
        if (App.current === "home" && el("a2hs").hidden) toast("글씨가 작으면 오른쪽 위 [가 글자크기]에서 키울 수 있어요");
      }, 3200);
    } catch (e) {}
    var m = location.hash.match(/^#s=(\w+)/i);
    var mc = location.hash.match(/^#c=(\w+)/i);
    var mq = location.hash.match(/^#q=(wall[1-3])/i);
    App.go("home");
    if (m) {
      var got0 = S.get("stamps", []);
      var s = STAMPS.filter(function (x) { return x.code === m[1].toUpperCase(); })
        .find(function (x) { return got0.indexOf(x.id) < 0; });
      if (s) setTimeout(function () { awardStamp(s.id); }, 400);
    }
    if (mc && mc[1] === FESTIVAL.adminCode) {
      setTimeout(function () { redeemCoffee(); }, 500);
    }
    if (mq) {
      setTimeout(function () { wqOpen(mq[1].toLowerCase()); }, 400);
    }
  }
  function goReady() {
    if (chimeTimer) clearTimeout(chimeTimer);
    loop.play().catch(function () {});
    setPhase("ready");
  }
  function startIntro(withSound) {
    setPhase("intro");
    mediaReady.then(function () {
      intro.play().catch(goReady);
      loop.play().catch(function () {});
      if (withSound) chimeTimer = setTimeout(function () { chime.play().catch(function () {}); }, CHIME_DELAY_MS);
    });
  }
  function skipIntro() {
    if (!chime.paused) chime.pause();
    intro.pause(); goReady();
  }

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) setPhase("static");

  // 캡처 모드(#...cap): 프레임을 좌상단 고정 정폭으로 — 헤드리스 스크린샷용
  if (/cap/.test(location.hash)) {
    document.body.style.justifyContent = "flex-start";
    var fr = el("frame");
    fr.style.width = "448px"; fr.style.maxWidth = "none"; fr.style.boxShadow = "none";
  }

  // 데모/캡처 훅: #demo=화면명 으로 열면 로그인·데이터 세팅 후 해당 화면으로 바로 진입 (스크린샷·시연용)
  var dm = location.hash.match(/^#demo(?:=(\w+))?/i);
  if (dm) {
    LS_OK = false;   /* 데모 시드가 실사용 저장소를 오염시키지 않게 */
    S.set("user", { empId: "1234", name: "김하이" });
    S.set("stamps", ["p1", "p4", "p5"]);
    S.set("coffee_issued", true);
    S.set("quiz_answers", { q1: { choice: 1, correct: true, replay: false, ts: Date.now() } });
    S.set("quiz_state", { activeId: "q1", phase: "revealed", openedAt: Date.now() - 60000, finishedIds: ["q1"] });
    S.set("cchat", { status: "matched", round: "14:30", table: "B", ts: Date.now() });
    S.set("gw_cleared", true);
    S.set("dept", "보상부문");
    S.set("wq_attempts", [{ set: "wall1", score: 80, passed: true, attemptNo: 1, dept: "보상부문", ts: Date.now() }]);
    S.set("entries", [{ id: "e1", code: "E-4821", source: "quiz", set: "wall1", ts: Date.now() }]);
    var target = dm[1] || "home";
    if (["admin", "screen", "wall_quiz", "wall_wave", "wall_live", "wall_metowe", "wall_rank", "wall_tv"].indexOf(target) >= 0) S.set("admin_authed", true);
    splash.classList.add("gone");
    el("frame").classList.remove("splash-mode");
    el("app").hidden = false;
    App.go(target);
    return;
  }

  /* ── 재방문: 이 기기를 기억하고 있으면 영상 스플래시를 건너뛰고 PIN만 받는다 ── */
  /* v19: 이 기기에서 입장한 적 있으면 스플래시·PIN 없이 바로 재입장 (로그아웃은 설정에서) */
  var savedU = S.get("user", {});
  if (savedU && savedU.empId) {
    enterApp();
    return;
  }
  var known = BE.on ? knownGet() : null;
  function quickLogin() {
    var pin = el("quickPin").value.trim();
    var qe = el("qErr"), btn = el("qBtn");
    var show = function (m) { qe.textContent = m; qe.style.display = "block"; };
    if (!/^\d{4}$/.test(pin)) { show("PIN 4자리를 입력해주세요."); return; }
    qe.style.display = "none";
    btn.disabled = true; btn.textContent = "확인 중…";
    var reset = function () { btn.disabled = false; btn.textContent = "입장"; };
    beHash(known.empId, pin).then(function (h) {
      beCall({ action: "login", emp: known.empId, name: known.name, h: h }, function (res) {
        reset();
        if (!res || !res.ok) {
          var msg = {
            pw: "PIN이 일치하지 않습니다. 처음 설정한 4자리를 입력해주세요.",
            notfound: "명부에서 찾을 수 없습니다. 운영진에게 문의해주세요.",
            name: "이름이 명부와 일치하지 않습니다.",
            param: "다시 시도해주세요."
          };
          show((res && msg[res.reason]) || "연결에 실패했어요. 잠시 후 다시 시도해주세요.");
          el("quickPin").value = "";
          return;
        }
        S.set("user", { empId: known.empId, name: res.name || known.name, dept: res.dept || "" });
        if (res.dept) S.set("dept", res.dept);
        knownSet({ empId: known.empId, name: res.name || known.name, dept: res.dept || "" });
        el("quick").hidden = true;
        enterApp();
        beStats();
        a2hsAuto();
      }, function () { reset(); show("서버에 연결할 수 없어요. 네트워크를 확인해주세요."); });
    });
  }
  if (known && known.empId) {
    splash.classList.add("gone");
    el("qName").textContent = known.name || "";
    el("qEmp").textContent = known.empId;
    el("quick").hidden = false;
    setTimeout(function () { try { el("quickPin").focus(); } catch (e) {} }, 150);
    el("qBtn").addEventListener("click", quickLogin);
    el("quickPin").addEventListener("keydown", function (e) { if (e.key === "Enter") quickLogin(); });
    el("qOther").addEventListener("click", function () {
      knownClear();
      el("quick").hidden = true;
      splash.classList.remove("gone");
    });
  }

  el("cover").addEventListener("click", function () { startIntro(true); });
  el("silent").addEventListener("click", function (e) { e.stopPropagation(); skipIntro(); });
  el("silent").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); skipIntro(); } });
  el("skip").addEventListener("click", skipIntro);
  intro.addEventListener("ended", goReady);

  /* 오프라인(서버 미연결)이면 PIN 입력을 숨긴다 */
  if (!BE.on) {
    if (el("userPin")) el("userPin").style.display = "none";
    if (el("pinNote")) el("pinNote").style.display = "none";
  }

  el("entryForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = el("empId").value.trim();
    var nm = el("userName").value.trim();
    var pin = el("userPin") ? el("userPin").value.trim() : "";
    var err = el("err");
    var btn = el("entryForm").querySelector("button");
    var show = function (m) { err.textContent = m; err.style.display = "block"; };
    /* 사번 형식은 회사마다 달라 느슨하게 받고, 실제 확인은 서버(명부)가 한다 */
    if (!/^[A-Za-z0-9-]{3,15}$/.test(id)) { show("사번을 확인해주세요."); return; }
    if (nm.length < 2) { show("이름을 입력해주세요."); return; }
    err.style.display = "none";

    if (!BE.on) {                       /* 서버 없이 단독 동작 (기존 방식) */
      S.set("user", { empId: id, name: nm });
      enterApp();
      a2hsAuto();
      return;
    }
    if (!/^\d{4}$/.test(pin)) { show("행사 PIN 4자리를 입력해주세요."); return; }

    btn.disabled = true; btn.textContent = "확인 중…";
    var reset = function () { btn.disabled = false; btn.textContent = "페스티벌 입장"; };
    beHash(id, pin).then(function (h) {
      beCall({ action: "login", emp: id, name: nm, h: h }, function (res) {
        reset();
        if (!res || !res.ok) {
          var msg = {
            notfound: "명부에 없는 사번입니다. 운영진에게 문의해주세요.",
            name: "사번과 이름이 일치하지 않습니다.",
            pw: "PIN이 일치하지 않습니다. 처음 설정한 4자리를 입력해주세요.",
            param: "입력값을 다시 확인해주세요."
          };
          show((res && msg[res.reason]) || "연결에 실패했어요. 잠시 후 다시 시도해주세요.");
          return;
        }
        S.set("user", { empId: id, name: res.name || nm, dept: res.dept || "" });
        if (res.dept) S.set("dept", res.dept);
        knownSet({ empId: id, name: res.name || nm, dept: res.dept || "" });   /* 다음 접속엔 PIN만 */
        enterApp();
        beStats();
        a2hsAuto();
        if (res.isNew) setTimeout(function () {
          toast("PIN이 등록되었어요 — 다음 접속에도 같은 4자리를 사용하세요");
        }, 700);
      }, function () {
        reset();
        show("서버에 연결할 수 없어요. 네트워크를 확인해주세요.");
      });
    });
  });
})();
</script>
