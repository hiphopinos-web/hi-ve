<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AX FESTIVAL 2026 · ME to WE</title>
<!-- 홈 화면에 추가 = 아이콘 한 번으로 실행 (설치·스토어 없음) -->
<link rel="manifest" href="manifest.json">
<!-- 본문 서체 · 로컬 미설치 기기에서도 Pretendard로 렌더 (오프라인이면 시스템 고딕으로 자동 폴백) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AX FESTIVAL">
<style>
  /* ═══════ AX FESTIVAL 그래픽 시스템 v5 「현대해상 디자인 2.0」 ═══════
     흰 배경 + HI Navy(#001F5B) 주색 + Vibrant Orange(#FF7E31) 엣지.
     위계 = 네이비 농도: 솔리드(행동·선택) > 흰 카드+헤어라인(주 콘텐츠) > 틴트 면(보조) > 옅은 회청(비활성).
     오렌지는 엣지에만: 헤더 하단선·탭 인디케이터·진행 게이지·획득·LIVE·키 숫자.
     사이니지·TV 송출은 네이비 다크 스테이지(--ink) 유지. */
  :root {
    --ink: #1E2124;                     /* 잉크 블랙 · 앱 안 다크 카드(라이브 퀴즈·게임·히어로) */
    --paper: #FFFFFF;                   /* 흰 면 · 헤더·바텀시트·탭바 (카드와 같은 값) */
    --bg: #F4F2F0;                      /* 스크롤 바탕 · 흰 카드를 띄우는 옅은 웜 그레이 */
    --white: #FFFFFF;                   /* 카드 서피스 */
    --surface2: #FFF6F0;                /* O5 보조 면 (design.md 오렌지 사다리) */
    --line: #FFE3D5;                    /* 오렌지 헤어라인 = 기본 선 */
    --mint: #FF7E31; --mint-deep: #FF9E1B; --blue: #418FDE; /* mint=Vibrant Orange(공식 O100) / deep=골드(다크 위 전용) */
    --tint: #FFEBE0; --tint2: #FFD8C1;  /* O10 틴트 면 / O25 강조 보더 */
    --acc2: #D64524;                    /* 밝은 면 위 오렌지 텍스트 */
    --hi: #1E2124;                      /* 제목·주요 텍스트 = 잉크 */
    --tx: #464C53; --muted: #6D7882; --faint: #98A2AC;
    --fs: 1;                            /* 글자 크기 배율 (설정에서 1 / 1.12 / 1.25) */
    --disp: "Impact", "Franklin Gothic Bold", "Arial Black", "Malgun Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* word-break:keep-all = 한글을 어절 단위로 끊는다 · 단어 중간에서 잘리지 않고 통째로 다음 줄로 */
  body { background: var(--bg); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; display: flex; justify-content: center; color: var(--tx); word-break: keep-all; overflow-wrap: break-word; }
  button, input, textarea { font-family: inherit; }
  #frame { position: relative; width: 100%; max-width: 448px; min-height: 100dvh; background: var(--bg); box-shadow: 0 0 32px rgba(20,30,40,0.08); }
  #frame.splash-mode { height: 100dvh; overflow: hidden; }

  /* ───────── 스플래시 (네이비+오렌지 브랜드 월드 · 유지) ───────── */
  #splash { position: absolute; inset: 0; z-index: 100; background: #001F5B; display: flex; flex-direction: column; overflow: hidden; }
  #splash.gone { display: none; }
  #splash video, #staticImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.7s; }
  #loopV { opacity: 0; }
  #splash[data-phase="ready"] #loopV { opacity: 1; }
  #splash[data-phase="ready"] #introV { opacity: 0; pointer-events: none; }
  #staticImg { display: none; }
  #splash[data-phase="static"] #staticImg { display: block; }
  #splash[data-phase="static"] video { display: none; }
  #cover { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 96px; background: none; border: 0; cursor: pointer; color: #fff; }
  #splash[data-phase="cover"] #cover { display: flex; }
  #cover .tap { font-size: calc(15.5px * var(--fs)); font-weight: 600; letter-spacing: 0.05em; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  #silent { margin-top: 12px; font-size: calc(13.5px * var(--fs)); color: rgba(255,255,255,0.5); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
  #skip { position: absolute; right: 20px; bottom: 20px; z-index: 20; display: none; border: 0; cursor: pointer; background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.7); font-size: calc(13.5px * var(--fs)); font-weight: 600; padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(4px); }
  #splash[data-phase="intro"] #skip { display: block; }
  #panel { position: relative; z-index: 10; margin-top: auto; transform: translateY(40px); opacity: 0; pointer-events: none; transition: transform 0.7s, opacity 0.7s; }
  #splash[data-phase="ready"] #panel, #splash[data-phase="static"] #panel { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #panel .inner { background: linear-gradient(to top, #001F5B 0%, rgba(0,31,91,0.85) 60%, transparent 100%); padding: 64px 24px 32px; }
  .tagline { text-align: center; font-size: calc(19px * var(--fs)); font-weight: 800; letter-spacing: 0.2em; color: #fff; }
  .tagline .me { color: rgba(255,255,255,0.6); }
  .tagline .we { color: #FF9E1B; text-shadow: 0 0 12px rgba(255,158,27,0.6); }
  .sub { margin-top: 6px; text-align: center; font-size: calc(13.5px * var(--fs)); color: rgba(255,255,255,0.6); }
  #entryForm { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  #entryForm input { width: 100%; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); padding: 14px 16px; font-size: calc(16.5px * var(--fs)); color: #fff; outline: none; backdrop-filter: blur(4px); }
  #entryForm input::placeholder { color: rgba(255,255,255,0.4); }
  #entryForm input:focus { border-color: #FF9E1B; }
  #err { font-size: calc(14.5px * var(--fs)); color: #fca5a5; display: none; }
  #entryForm button { width: 100%; border: 0; cursor: pointer; border-radius: 16px; background: #FF7E31; padding: 16px; font-size: calc(16.5px * var(--fs)); font-weight: 700; color: #fff; transition: transform 0.1s; }
  #entryForm button:active { transform: scale(0.98); }
  .note { text-align: center; font-size: calc(12.5px * var(--fs)); color: rgba(255,255,255,0.4); }

  /* 홈 화면에 추가 · 로그인 직후 전용 단계 화면 (풀스크린) */
  #a2hs { position: fixed; inset: 0; z-index: 120; background: var(--paper); overflow-y: auto; animation: fadeIn 0.3s; }
  #a2hs[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  #a2hs .a-wrap { min-height: 100%; max-width: 360px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 44px 24px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
  #a2hs .a-eyebrow { font-family: var(--disp); font-size: calc(13.5px * var(--fs)); letter-spacing: 0.14em; color: var(--acc2); }
  #a2hs .a-ico { margin: 18px auto 0; width: 86px; height: 86px; border-radius: 22px; background: var(--mint); border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 14px 34px rgba(255,126,49,0.3); }
  #a2hs .a-ico b { font-family: var(--disp); font-size: 30px; line-height: 1; color: #fff; }
  #a2hs .a-ico small { font-size: calc(10px * var(--fs)); font-weight: 800; letter-spacing: 0.04em; color: #fff; }
  #a2hs .a-t { margin-top: 20px; font-size: 24px; font-weight: 800; line-height: 1.35; color: var(--hi); letter-spacing: -0.02em; }
  #a2hs .a-s { margin-top: 10px; font-size: calc(15.5px * var(--fs)); line-height: 1.7; color: var(--muted); }
  #a2hs .a-s b { color: var(--acc2); }
  #a2hs #a2hsBody { margin-top: 24px; text-align: left; }
  #a2hs .a-step { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; font-size: calc(15.5px * var(--fs)); font-weight: 700; color: var(--hi); }
  #a2hs .a-step .n { flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--hi); color: #fff; display: flex; align-items: center; justify-content: center; font-size: calc(12.5px * var(--fs)); font-weight: 900; }
  #a2hs .a-step .g { font-family: var(--disp); font-size: calc(16.5px * var(--fs)); color: var(--acc2); }
  #a2hs .a-go { width: 100%; margin-top: 14px; border: 0; cursor: pointer; border-radius: 12px; background: var(--mint); padding: 15px; font-family: inherit; font-size: calc(16.5px * var(--fs)); font-weight: 800; color: #fff; }
  #a2hs .a-note { margin-top: 10px; font-size: calc(13.5px * var(--fs)); line-height: 1.6; color: var(--muted); }
  #a2hs .a-later { width: 100%; margin-top: 10px; border: 0; background: none; cursor: pointer; font-family: inherit; font-size: calc(14.5px * var(--fs)); font-weight: 700; color: var(--faint); padding: 8px; }
  #a2hs .a-url { margin-top: 8px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; font-size: calc(12.5px * var(--fs)); color: var(--muted); word-break: break-all; }

  /* 재방문 · PIN 전용 화면 (영상 스플래시 없이 바로) */
  #quick { position: absolute; inset: 0; z-index: 110; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #quick[hidden] { display: none; }
  #quick .q-card { width: 100%; max-width: 340px; text-align: center; }
  #quick .q-eyebrow { font-family: var(--disp); font-size: calc(13.5px * var(--fs)); letter-spacing: 0.14em; color: var(--acc2); }
  #quick .q-hello { margin-top: 14px; font-size: 26px; font-weight: 800; color: var(--hi); letter-spacing: -0.02em; }
  #quick .q-who { margin-top: 8px; font-size: calc(15.5px * var(--fs)); color: var(--muted); }
  #quick .q-who b { color: var(--hi); font-weight: 800; }
  #quick .q-who span { margin-left: 7px; color: var(--faint); font-family: var(--disp); font-size: calc(14.5px * var(--fs)); }
  #quick input { width: 100%; margin-top: 26px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--white); padding: 16px; font-size: 20px; font-weight: 800; letter-spacing: 0.5em; text-align: center; color: var(--hi); outline: none; }
  #quick input:focus { border-color: var(--mint); }
  #quick input::placeholder { letter-spacing: 0; font-size: calc(16.5px * var(--fs)); font-weight: 700; color: var(--faint); }
  #qErr { display: none; margin-top: 10px; font-size: calc(14.5px * var(--fs)); font-weight: 700; color: #E5484D; }
  #quick .q-go { width: 100%; margin-top: 14px; border: 0; cursor: pointer; border-radius: 12px; background: var(--mint); padding: 16px; font-family: inherit; font-size: calc(16.5px * var(--fs)); font-weight: 800; color: #fff; }
  #quick .q-go:disabled { opacity: 0.5; }
  #quick .q-other { width: 100%; margin-top: 10px; border: 0; background: none; cursor: pointer; font-family: inherit; font-size: calc(14.5px * var(--fs)); font-weight: 700; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; padding: 8px; }

  /* ───────── 앱 셸 ─────────
     헤더 v16 · 아이덴티티(네이비칩 + 톱니)는 전 화면 고정, 그 아래 줄만 화면에 따라 바뀐다.
     홈 = 슬로건 + 행사 정보줄 / 그 밖 = 제목줄(상세는 뒤로가기). 헤더 끝은 오렌지 2px 엣지로 본문과 분리 */
  #topbar { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); display: block; padding: 10px 14px 12px; }
  /* 유틸 행 · 아바타(패스포트) + 알림 + 설정 (홈·탭 루트 공통) */
  #topbar .hu { display: flex; align-items: center; gap: 6px; }
  #topbar .hu .sp { flex: 1; }
  #topbar .wm { flex: none; display: flex; align-items: baseline; gap: 5px; background: none; border: 0; padding: 2px 0; cursor: pointer; font-family: inherit; }
  #topbar .wm b { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; color: var(--mint); }
  #topbar .wm span { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--hi); }
  #topbar .gear { position: relative; flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 11px; background: none; color: var(--muted); cursor: pointer; padding: 0; }
  #topbar .gear:active { background: var(--surface2); }
  #topbar .gear svg { width: 21px; height: 21px; display: block; }
  #topbar .gear .bdg { position: absolute; top: 0; right: -1px; min-width: 16px; height: 16px; border-radius: 999px; background: var(--mint); color: #fff; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  /* 접근성 · 공식 앱처럼 [일반|큰글씨]를 헤더에 상시 노출 (자체 크기는 --fs 영향 밖) */
  #topbar .fstog { flex: none; display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  #topbar .fstog button { border: 0; background: none; cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 5px 11px; border-radius: 999px; line-height: 1.2; }
  #topbar .fstog button.on { background: var(--mint); color: #fff; }
  /* 홈 · 큰 인사말 */
  #topbar .hgr { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 9px; }
  #topbar .hgr .ov { font-size: calc(11.5px * var(--fs)); font-weight: 800; letter-spacing: 0.04em; color: var(--faint); }
  #topbar .hgr .big { margin-top: 4px; font-size: calc(22px * var(--fs)); font-weight: 700; color: var(--muted); line-height: 1.25; letter-spacing: -0.01em; }
  #topbar .hgr .big b { color: var(--hi); font-weight: 800; }
  /* 탭 루트 · 큰 제목 */
  #topbar .hbig { margin-top: 7px; font-size: calc(22px * var(--fs)); font-weight: 800; color: var(--hi); letter-spacing: -0.01em; line-height: 1.25; }
  /* 서브 화면 · 뒤로가기 타이틀 행 */
  #topbar .httl { display: flex; align-items: center; gap: 6px; }
  #topbar .httl .back { flex: none; border: 0; background: none; color: var(--hi); cursor: pointer; width: 32px; height: 32px; margin-left: -6px; padding: 0; display: flex; align-items: center; justify-content: center; }
  #topbar .httl .back svg { width: 22px; height: 22px; display: block; }
  #topbar .httl .title { flex: 1; min-width: 0; font-size: calc(16.5px * var(--fs)); font-weight: 800; color: var(--hi); line-height: 1.35; }
  #topbar .httl .chip { flex: none; padding: 5px 10px; font-size: calc(12.5px * var(--fs)); }
  #view { padding: 16px 16px 112px; min-height: calc(100dvh - 58px); }

  #tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 448px; z-index: 40; display: flex; background: rgba(255,255,255,0.97); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  #tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 8px; border: 0; background: none; cursor: pointer; font-family: inherit; font-size: calc(11.5px * var(--fs)); font-weight: 600; letter-spacing: -0.02em; color: var(--faint); }
  #tabbar button.on { font-weight: 700; }
  #tabbar button .ico { width: 23px; height: 23px; display: flex; align-items: center; justify-content: center; color: var(--faint); }
  #tabbar button .ico svg { width: 23px; height: 23px; display: block; }
  #tabbar button.on { color: var(--mint); }
  #tabbar button.on .ico { color: var(--mint); }
  /* 중앙 FAB · 스탬프 적립 (행사장 실물 동작 = QR) */
  #tabbar .fab { flex: none; width: 56px; height: 56px; margin: -20px 2px 0; border-radius: 999px; background: var(--mint); color: #fff; border: 4px solid var(--paper); box-shadow: 0 6px 16px rgba(214,69,36,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  #tabbar .fab svg { width: 24px; height: 24px; display: block; }
  #tabbar .fab:active { transform: scale(0.95); }

  /* ───────── 브랜드 배너 (패스포트·응모권 히어로) ───────── */
  .skb { margin-bottom: 16px; }
  .skb .r1 { background: var(--ink); color: #fff; padding: 14px 16px 12px; border-radius: 14px; }
  .skb .r1 .big { font-family: var(--disp); font-size: 34px; letter-spacing: 0.02em; line-height: 1; }
  .skb .r2 { display: flex; gap: 6px; margin-top: 6px; }
  .skb .r2 .y { background: var(--mint); color: #fff; font-family: var(--disp); font-size: 26px; padding: 8px 14px 6px; line-height: 1; border-radius: 14px; }
  .skb .r2 .s { flex: 1; background: var(--mint); color: #fff; padding: 7px 12px 6px; display: flex; flex-direction: column; justify-content: center; border-radius: 14px; }
  .skb .r2 .s .t { font-family: var(--disp); font-size: calc(16.5px * var(--fs)); letter-spacing: 0.06em; }
  .skb .r2 .s .u { font-size: calc(11px * var(--fs)); font-weight: 800; letter-spacing: 0.02em; margin-top: 2px; }
  .skb .r3 { background: var(--ink); color: #fff; margin-top: 6px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-radius: 14px; }
  .skb .r3 .d { font-family: var(--disp); font-size: calc(15.5px * var(--fs)); letter-spacing: 0.04em; line-height: 1.35; }
  .skb .r3 .geo { display: flex; align-items: center; gap: 8px; }
  .skb .r3 .disc { width: 30px; height: 30px; border-radius: 999px; background: var(--mint-deep); position: relative; }
  .skb .r3 .disc::after { content: ""; position: absolute; inset: 9px; border-radius: 999px; background: #fff; }
  .skb .r3 .tri { width: 0; height: 0; border-top: 13px solid transparent; border-bottom: 13px solid transparent; border-left: 18px solid var(--mint); }
  .skb .r3 .tri + .tri { margin-left: -6px; border-left-color: var(--mint-deep); }

  /* ───────── 공용 컴포넌트 ───────── */
  .disp { font-family: var(--disp); letter-spacing: 0.02em; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .card.soft { border-color: transparent; background: var(--surface2); }
  .mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; } .mt16 { margin-top: 16px; }
  .h3 { font-size: calc(16.5px * var(--fs)); font-weight: 800; color: var(--hi); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .sub-label { font-size: calc(14.5px * var(--fs)); font-weight: 800; color: var(--hi); margin: 18px 0 8px; }
  .muted { color: var(--muted); font-size: calc(14.5px * var(--fs)); line-height: 1.55; }
  .btn { display: block; width: 100%; border: 0; cursor: pointer; border-radius: 12px; padding: 13px; font-size: calc(15.5px * var(--fs)); font-weight: 800; color: var(--hi); background: var(--surface2); transition: transform 0.1s; }
  .btn:active { transform: scale(0.98); }
  .btn.mint { background: var(--mint); color: #fff; }
  .btn.line { background: transparent; color: var(--hi); border: 1px solid var(--line); }
  .btn.gray { background: #F3F1EF; color: #B6B0AA; }
  .btn:disabled { background: #F3F1EF; color: #B6B0AA; cursor: default; }

  /* ── 프로그램 탭 · 층 카드·맵·동선·세션 ── */

  /* 층 칩 = 프로그램 탭의 기준선. 스크롤해도 헤더 바로 아래에 붙어 있게 한다(--stick = 헤더 실측 높이) */

  /* ── 과제상담 (DAP ZONE) · 앱 공통 토큰만 사용 ── */

  .rstep { display: flex; gap: 5px; margin-top: 14px; }

  /* 공용 모달 */

  .seg.wide { overflow-x: auto; }
  /* 글자를 키우면 탭이 폭을 넘기므로 가로 스크롤로 (숨기면 마지막 탭을 누를 수 없다) */

  /* ME to WE 라이브 월 */
  .mt-stage { position: relative; margin-top: 12px; border-radius: 20px; background: #05070B center/cover no-repeat; border: 1px solid rgba(255,255,255,0.12); overflow: hidden; height: 54vh; min-height: 330px; }

  .mt-count { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }

  .mt-steps span.hit { border: 1px solid var(--mint-deep); background: rgba(255,158,27,0.12); color: var(--mint-deep); opacity: 1; }

  .mt-demo .lb { flex-basis: 100%; text-align: center; font-size: calc(11.5px * var(--fs)); font-weight: 800; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); }
  .mt-demo button { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.22); color: rgba(255,255,255,0.85); font-family: inherit; font-size: calc(14.5px * var(--fs)); font-weight: 800; padding: 8px 13px; border-radius: 999px; cursor: pointer; }
  .mt-demo button.on { background: var(--mint-deep); border-color: var(--mint-deep); color: var(--ink); }
  /* 홈 LIVE 섹션 · 미니 월 · 이벤트 현황 · 랭킹 · 혼잡도 */

  /* ═══════ 홈 · 히어로 챌린지 + 벤토 그리드 (구획 문법은 design.md §4) ═══════ */

  /* 프로모 밴드 · 전폭 틴트 */

  /* 지금 진행 중 */

  .nowcard .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: pulse 1.6s infinite; }
  .nowcard .when { font-family: var(--disp); font-size: calc(14.5px * var(--fs)); color: var(--muted); letter-spacing: 0.03em; }
  .nowcard .ttl { margin-top: 11px; font-size: calc(19px * var(--fs)); font-weight: 800; color: var(--hi); line-height: 1.35; letter-spacing: -0.01em; }

  .nowcard .next { display: flex; align-items: center; gap: 10px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line); }
  .nowcard .next .lb { font-size: calc(12.5px * var(--fs)); font-weight: 800; color: var(--faint); }
  .nowcard .next .tm { font-family: var(--disp); font-size: calc(15.5px * var(--fs)); color: var(--hi); }

  /* 내 일정 · 예약·매칭이 있을 때만 (오렌지 틴트 = 내 것) */

var MT_CFG = { gapMs: 6000, batchAt: 8, breathe: 0.07, breatheSec: 5, orbitSec: 480, bands: 14 };
var MT = {

function mtBuild(cv) {

  var F = "px 'Arial Black',Arial,sans-serif";
  try { ox.letterSpacing = Math.round(w * 0.012) + "px"; } catch (e) {}

     그보다 정사각에 가까우면 3단 스택으로 화면을 채운다 (TV 전체화면 = 스테이지 ~1.3) */
  var stack = h > w * 0.69;

    ox.font = "900 " + s1 + F; ox.fillText("ME", w / 2, h * 0.2);
    ox.font = "900 " + Math.floor(s1 * 0.42) + F; ox.fillText("to", w / 2, h * 0.47);

  var lo = 2, hi = 48, g = 4;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;

/* 채움 순서 = 랜덤 산포 · 가로 밴드 14개를 위·아래로 크게 오가며 라운드로빈으로 하나씩,
   밴드 안은 결정적 셔플. 연속 점등이 화면 위아래를 무작위로 오가면서도 워드 전체가 고르게 차오른다 */

/* ═══ 프로그램 신청 · seat(좌석)·slot(시간대)·link(기존 시스템) ═══ */
function sessById(id) { return SESSIONS.filter(function (s) { return s.id === id; })[0]; }
function sessMy() { return S.get("sess_my", {}); }
function sessMine(id) { return sessMy()[id] || null; }
function sessStartMin(tm) { var m = /(\d{1,2}):(\d{2})/.exec(tm || ""); return m ? (+m[1]) * 60 + (+m[2]) : 9999; }
function sessRange(s) { var m = /(\d{1,2}):(\d{2})\s*~\s*(\d{1,2}):(\d{2})/.exec(s.tm); return m ? [(+m[1]) * 60 + (+m[2]), (+m[3]) * 60 + (+m[4])] : null; }
function sessMineList() {
  var my = sessMy();
  return SESSIONS.filter(function (s) { return my[s.id]; })
    .map(function (s) { return { s: s, slot: my[s.id].slot || null }; })
    .sort(function (a, b) { return sessStartMin(a.slot || a.s.tm) - sessStartMin(b.slot || b.s.tm); });
}
function sessRemain(s) {
  if (BE.on && BE.stats && BE.stats.sess && BE.stats.sess[s.id] != null)
    return Math.max(0, s.cap - BE.stats.sess[s.id]);
  return Math.max(0, s.cap - s.seed - (sessMine(s.id) ? 1 : 0));
}
function hm2(min) { var h = Math.floor(min / 60), m = min % 60; return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
function sessSlots(s) {
  var r = sessRange(s), out = [], t;
  for (t = r[0]; t + s.per <= r[1]; t += s.per) out.push(hm2(t));
  return out;
}
function slotRemain(s, t) { /* 서버 연동 전 결정적 목업 · 슬롯마다 25~100% 채움 */
  var seed = 0, k = s.id + t, i;
  for (i = 0; i < k.length; i++) seed += k.charCodeAt(i) * (i + 7);
  var used = Math.floor(s.cap * (0.25 + (mtHash(seed) % 1000) / 1000 * 0.78));
  var mine = sessMine(s.id);
  if (mine && mine.slot === t) used = Math.min(s.cap, used + 1);
  return Math.max(0, s.cap - used);
}
function sessOverlap(s) {
  var r = sessRange(s); if (!r) return null;
  var hit = null;
  sessMineList().forEach(function (x) {
    if (x.s.id === s.id || x.s.kind !== "seat") return;
    var r2 = sessRange(x.s);
    if (r2 && r[0] < r2[1] && r2[0] < r[1]) hit = x.s;
  });
  return hit;
}
function sessBook(id, slot) {
  var s = sessById(id), my = sessMy();
  if (!s || my[id]) return;
  if (s.kind === "seat" && sessRemain(s) <= 0) { toast("만석입니다. 취소가 나오면 다시 열려요"); return; }
  if (s.kind === "slot" && !slot) { toast("시간을 먼저 선택하세요"); return; }
  if (s.kind === "seat") {
    var ov = sessOverlap(s);
    if (ov) {
      modalOpen('<b style="font-size:calc(17px * var(--fs));color:var(--hi)">시간이 겹칩니다</b>' +
        '<p class="muted" style="margin-top:8px">「' + esc(ov.ttl) + '」(' + ov.tm + ') 신청과 시간이 겹쳐요. 오후 세션은 1개만 참석할 수 있습니다.</p>' +
        '<button class="btn mint" style="margin-top:14px" onclick="modalClose(); sessSwap(\'' + ov.id + '\', \'' + id + '\')">기존을 취소하고 이걸로 신청</button>' +
        '<button class="btn line" style="margin-top:8px" onclick="modalClose()">그대로 두기</button>');
      return;
    }
  }
  my[id] = { slot: slot || null, ts: Date.now() };
  S.set("sess_my", my);
  PROG.slot = null;
  if (BE.on) beCall({ action: "sess_book", emp: (S.get("user", {}) || {}).empId || "", name: (S.get("user", {}) || {}).name || "", sid: id, slot: slot || "" }, function () {}, function () {});
  toast((slot ? slot + " · " : "") + "신청 완료. 홈 내 일정에 담겼어요");
  App.render();
}
function sessSwap(oldId, newId) {
  var my = sessMy(); delete my[oldId]; S.set("sess_my", my);
  if (BE.on) beCall({ action: "sess_cancel", emp: (S.get("user", {}) || {}).empId || "", sid: oldId }, function () {}, function () {});

}
function sessCancel(id) {

          '<p class="muted" style="margin-top:8px;text-align:center;font-size:calc(13.5px * var(--fs))">DAP Zone 데스크에서 확인 후 수령 · 중복 수령 방지 코드예요.</p></div></div>' +

       my && my.status === "canceled" ? '<div class="card soft mb12"><p style="font-size:calc(14.5px * var(--fs));color:#FF6B61;font-weight:700">이전 신청이 취소되었습니다. 아래에서 다시 신청할 수 있습니다.</p></div>' : "") +
      hero('<p style="margin-top:10px;font-size:calc(19px * var(--fs));font-weight:800;line-height:1.45">내 업무에 AI를 어떻게 적용할지,<br><span style="color:var(--mint)">30분 1:1 과제상담</span></p>' +

      '<p class="sub-label" style="margin-top:18px">상담 시간 선택 <span style="font-weight:700;color:var(--faint)">(30분 단위 · 점심시간 제외)</span></p>' +
      '<div class="slotgrid">' + morning.map(cell).join("") +
      '<div class="lunchbar">점심시간</div>' + afternoon.map(cell).join("") + "</div>" +
      '<p style="margin-top:12px;font-size:calc(12.5px * var(--fs));color:var(--faint);line-height:1.6">미팅룸 ② 당일 신청 전용 (잔여 ' + resvRemain() + '석) · 사전신청(미팅룸 ①)은 마감</p>' +
      '<button class="btn mint" style="margin-top:12px;padding:15px"' + (DAPSEL ? ' onclick="bookResv()"' : " disabled") + ">상담 신청하기" + (DAPSEL ? " · " + DAPSEL : "") + "</button>";
  },

  /* ── v10 【신규 C】 AX Now! 부스 연동 · v5 p28·31~41 ── */

      '<p style="margin-top:6px;font-size:calc(19px * var(--fs));font-weight:800;color:#fff;line-height:1.4">설명이 아닌,<br>체험으로 증명합니다</p>' +
      '<p class="muted" style="margin-top:6px;font-size:calc(14.5px * var(--fs))">부스 1곳만 체험해도 패스포트 02가 채워져요.</p></div>' +
      '<div class="card mb8"><div class="row" style="justify-content:space-between"><b style="font-size:calc(16.5px * var(--fs));color:var(--hi)">① HI-Helper</b><span class="badge blue">10.1 OPEN</span></div>' +
      '<p class="muted" style="margin-top:4px;font-size:calc(14.5px * var(--fs))">보험 설계를 돕는 LLM 비서</p>' +
      '<p style="margin-top:8px;font-size:calc(14.5px * var(--fs));line-height:1.8;color:var(--tx)">STEP 1 · 내 보험 설계해보기 (상품 증정)<br>STEP 2 · HiDI-Helper 시연·체험<br>STEP 3 · 피드백 + 체험 완료 스탬프</p></div>' +
      '<div class="card mb12"><div class="row" style="justify-content:space-between"><b style="font-size:calc(16.5px * var(--fs));color:var(--hi)">② HIDI-Q</b><span class="badge blue">11.1 OPEN</span></div>' +
      '<p class="muted" style="margin-top:4px;font-size:calc(14.5px * var(--fs))">업무 문서 AI 비서 · 5분 3-STEP · 문서 3개, 질문 3개로 확인</p>' +
      '<p style="margin-top:8px;font-size:calc(14.5px * var(--fs));line-height:1.8;color:var(--tx)">STEP 1 · 부서 키트 + 질문 셋 수령 (1분)<br>STEP 2 · 업로드 → 질의응답 → 초안 생성 (5분)<br>STEP 3 · 2027 로드맵 확인 + Passport 발급</p>' +
      '<p style="margin-top:6px;font-size:calc(12.5px * var(--fs));color:var(--faint)">&ldquo;초안까지는 AI, 판단은 담당자&rdquo; · 세션 종료 시 자료 삭제</p></div>' +
      '<div class="card mb12" style="border-color:var(--mint-deep)"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">체험 완료 스탬프 (PASSPORT 02)</b>' +
      '<p class="muted" style="margin-top:4px;font-size:calc(13.5px * var(--fs))">체험을 마치면 스태프가 완료 QR을 보여드려요. 스캔하면 적립됩니다.</p>' +
      '<button class="btn' + (got2 ? " gray" : " mint") + '" style="margin-top:10px" onclick="boothStamp()">' + (got2 ? "적립 완료 ✔" : "완료 QR 스캔 (시연)") + "</button></div>" +
      '<div class="card mb12"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">30초 피드백</b><p class="muted" style="margin-top:3px;font-size:calc(13.5px * var(--fs))">2문항 · 서비스 개선 우선순위에 바로 반영돼요.' + (fb.length ? " (제출 " + fb.length + "건)" : "") + "</p>" +
      '<div class="row" style="flex-wrap:wrap;margin-top:10px">' + ["최고예요", "좋아요", "보통", "아쉬워요"].map(function (t, i) {
        return '<button class="tag-btn" data-fb="1" onclick="fbPick(' + (4 - i) + ', this)">' + t + "</button>";
      }).join("") + "</div>" +
      '<input id="fbText" class="input" placeholder="한 줄 의견 (선택)" style="margin-top:10px">' +
      '<button class="btn" style="margin-top:10px" onclick="boothFeedback()">피드백 제출</button></div>' +
      '<div class="card mb12"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">내 질문 1개 · HIDI-Q에 물어보고 싶은 것</b>' +
      '<p class="muted" style="margin-top:3px;font-size:calc(13.5px * var(--fs))">질문 셋 카드 뒷면의 &ldquo;내 질문&rdquo;을 앱으로 · 아이디어 풀에 담겨 2027 DAP 후보가 됩니다.</p>' +
      '<textarea id="bqText" class="input" rows="2" maxlength="200" style="margin-top:10px;resize:none" placeholder="예: 대인 합의금 산정 시 과실비율은 어디를 보면 되나요?"></textarea>' +
      '<button class="btn mint" style="margin-top:10px" onclick="boothQuestion()">질문 제출 (아이디어 적립)</button></div>' +
      '<div class="card"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">우리 부서 시연 신청</b>' +
      '<p class="muted" style="margin-top:3px;font-size:calc(13.5px * var(--fs))">부스가 끝이 아니라 시작. 부서로 찾아가는 시연을 신청하세요.' + (dr.length ? " (접수 " + dr.length + "건)" : "") + "</p>" +
      '<input id="drDept" class="input" placeholder="부서명" style="margin-top:10px">' +
      '<input id="drText" class="input" placeholder="활용하고 싶은 업무 (선택)" style="margin-top:8px">' +
      '<button class="btn" style="margin-top:10px" onclick="demoRequest()">시연 신청</button></div>';
  },

  /* ── v10 【신규 B】 DAP Wall QR 퀴즈 ── */
  wq_list: function () {
    var dept = S.get("dept", null);
    var pass = wqPassScore();
    var deptCard = dept ?
      '<div class="row mb12" style="justify-content:space-between"><span style="font-size:calc(14.5px * var(--fs));font-weight:700;color:var(--muted)">우리 부문: <b style="color:var(--hi)">' + esc(dept) + '</b> · 정답률 경쟁 반영 중</span><button class="tag-btn" onclick="S.set(\'dept\', null)">변경</button></div>' :
      '<div class="card mb12" style="border-color:var(--mint-deep)"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">부문 선택 · 시작 전 1번만</b><p class="muted" style="margin-top:3px;font-size:calc(13.5px * var(--fs))">Special Wall 스크린의 부문별 정답률 경쟁에 반영돼요.</p>' +
      '<div class="row" style="flex-wrap:wrap;margin-top:10px">' + DEPTS.map(function (d) {
        return '<button class="tag-btn" onclick="pickDept(\'' + d + '\')">' + d + "</button>";
      }).join("") + "</div></div>";
    var setCards = wqSets().map(function (s, i) {
      var best = wqBest(s.id);
      var badge = !wqActive(s.id) ? '<span class="badge gray">점검 중</span>' :
        best && best.passed ? '<span class="badge mint">통과 ' + best.score + "점</span>" :
        best ? '<span class="badge blue">최고 ' + best.score + "점</span>" : '<span class="badge gray">미응시</span>';
      return '<div class="card mb8" style="display:flex;align-items:center;gap:12px;cursor:pointer" onclick="wqOpen(\'' + s.id + '\')">' +
        '<span class="disp" style="font-size:calc(15.5px * var(--fs));color:var(--hi);border:1px solid var(--line);border-radius:4px;padding:6px 8px">QR ' + (i + 1) + "</span>" +
        '<div style="flex:1"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">' + esc(s.name) + '</b><p class="muted" style="font-size:calc(13.5px * var(--fs));margin-top:2px">' + esc(s.theme) + "</p></div>" + badge + "</div>";
    }).join("");
    /* 부문 정답률 랭킹 · 홈에 있던 블록을 집계의 출처인 이 화면으로 (1F Special Wall 사이니지와 같은 수치) */
    var rows = deptStats(), myIdx = -1;
    for (var ri = 0; ri < rows.length; ri++) if (rows[ri].d === dept) { myIdx = ri; break; }
    var rrow = function (r, idx, dim) {
      return '<div class="rrow' + (dim ? " dim" : "") + '"><span class="rno' + (idx === 0 ? " g" : "") + '">' + (idx + 1) + "</span>" +
        '<span class="rname' + (r.d === dept ? " me" : "") + '">' + esc(r.d) + "</span>" +
        '<span class="rbar"><i style="width:' + Math.round(r.avg / Math.max(1, rows[0].avg) * 100) + '%"></i></span>' +
        '<b class="disp rv">' + r.avg + "</b></div>";
    };
    var rankCard = !rows.length ? "" :
      '<div class="card mt16" style="padding:15px 16px">' +
      '<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px">' +
      '<b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">부문 정답률 랭킹</b>' +
      '<span style="font-size:calc(12.5px * var(--fs));color:var(--faint)">100점 만점</span></div>' +
      rows.slice(0, 3).map(function (r, i) { return rrow(r, i, false); }).join("") +
      ((dept && myIdx >= 3) ? rrow(rows[myIdx], myIdx, true) : "") +
      '<p style="margin-top:9px;font-size:calc(12.5px * var(--fs));color:var(--faint);line-height:1.55">지금 문제를 풀면 우리 부문 점수가 올라갑니다. 1F Special Wall 화면과 같은 집계예요.</p></div>';
    return deptCard + setCards + rankCard +
      '<div class="card soft mt16"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">참여 방법</b>' +
      '<p class="muted" style="margin-top:6px;font-size:calc(14.5px * var(--fs));line-height:1.8">① 1F DAP Wall·Special Wall의 QR 발견 → ② 스캔하면 5문항 오픈 → ③ 정답은 벽 전시 안에서 탐색 → ④ 평균 <b style="color:var(--hi)">' + pass + '점 이상</b> 즉석경품 응모권 → ⑤ 이벤트존에서 즉석 추첨!</p>' +
      '<p class="muted" style="margin-top:6px;font-size:calc(13.5px * var(--fs))">' + pass + '점 미만은 <b>무제한 재응시</b> (문항·보기 순서가 바뀌어요) · 3세트 모두 통과 = 보너스 응모권 · 키노트 라이브 퀴즈와는 별개예요. 테스트 버전은 QR 없이 세트를 바로 열 수 있습니다.</p></div>';
  },

  wq_play: function () {
    if (!WQ.set) {
      return '<div class="card soft" style="text-align:center"><p class="muted">세트를 선택하면 문항이 열립니다.</p>' +
        '<button class="btn mint" style="margin-top:12px" onclick="App.go(\'wq_list\')">세트 고르러 가기</button></div>';
    }
    if (WQ.submitted) {
      var r = WQ.result;
      var entryN = S.get("entries", []).length;
      return '<div class="cho-box" style="padding:26px 18px"><p style="font-size:calc(12.5px * var(--fs));font-weight:800;letter-spacing:0.08em;color:#8FA2C9">' + esc(WQ.name) + " · " + WQ.qs.length + '문항</p>' +
        '<p class="disp" style="font-size:44px;margin-top:6px;color:' + (r.passed ? "var(--mint)" : "#FF6B61") + '">' + r.score + '점</p>' +
        '<p class="hint">' + (r.passed ? "통과! (" + r.correct + "/" + WQ.qs.length + " 정답 · 커트라인 " + wqPassScore() + "점)" :
          r.correct + "/" + WQ.qs.length + " 정답 · 커트라인 " + wqPassScore() + "점. 정답은 전부 1F 벽에 있어요. 다시 도전!") + "</p></div>" +
        (r.passed ? '<div class="card mb8" style="border-color:var(--mint-deep)"><p style="font-size:calc(14.5px * var(--fs));color:var(--tx)">응모권 지갑: <b style="color:var(--hi)">' + entryN + '장</b> · 1F 이벤트존 즉석 추첨(가챠)에서 사용하세요.</p></div>' : "") +
        '<button class="btn mint mb8" style="padding:15px" onclick="wqRetry(\'' + WQ.set + '\')">' + (r.passed ? "한 번 더 (기록 갱신)" : "재응시 · 순서 셔플") + "</button>" +
        '<button class="btn line" onclick="App.go(\'wq_list\')">세트 목록으로</button>';
    }
    var n = Object.keys(WQ.picks).length;
    return '<div class="card soft mb12" style="padding:12px 14px"><div class="row" style="justify-content:space-between"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi)">' + esc(WQ.name) + " · " + esc(WQ.theme) + '</b><span class="badge tint">' + n + "/" + WQ.qs.length + "</span></div>" +
      '<p class="muted" style="font-size:calc(12.5px * var(--fs));margin-top:3px">시간 제한 없음 · 정답은 1F 벽 전시 안에 있어요</p></div>' +
      WQ.qs.map(function (q, qi) {
        return '<div class="card mb8"><b style="font-size:calc(15.5px * var(--fs));color:var(--hi);line-height:1.5">Q' + (qi + 1) + ". " + esc(q.q) + "</b>" +
          q.o.map(function (o, oi) {
            return '<button class="wopt' + (WQ.picks[qi] === oi ? " on" : "") + '" onclick="wqPick(' + qi + "," + oi + ')">' + esc(o) + "</button>";
          }).join("") + "</div>";
      }).join("") +
      '<button class="btn mint" style="padding:15px;margin-top:4px" onclick="wqSubmit()">제출하고 채점 (' + n + "/" + WQ.qs.length + ")</button>";
  },

  entries: function () {
    var e = S.get("entries", []);
    if (!e.length) {
      return '<div class="card soft" style="text-align:center"><p class="muted">아직 응모권이 없어요.<br>DAP Wall QR 퀴즈에서 ' + wqPassScore() + '점 이상이면 1장!</p>' +
        '<button class="btn mint" style="margin-top:12px" onclick="App.go(\'wq_list\')">QR 퀴즈 풀러 가기</button></div>';
    }
    return e.slice().reverse().map(function (x) {
      var label = x.source === "bonus" ? "3세트 완주 보너스" : "QR 퀴즈 통과 (" + (x.set || "") + ")";
      return '<div class="coupon mb8"><div class="head"><b>즉석경품 응모권</b><span class="badge ink">' + esc(label) + "</span></div>" +
        '<div class="body"><p style="text-align:center;font-family:var(--disp);font-size:26px;letter-spacing:0.1em;color:var(--hi)">' + esc(x.code) + "</p>" +
        '<p class="muted" style="margin-top:6px;text-align:center;font-size:calc(13.5px * var(--fs))">1F 이벤트존 부스에 보여주면 즉석 추첨(가챠) 1회 · ' + fmtTime(x.ts) + "</p></div></div>";
    }).join("") +
      '<div class="card soft mt16"><p class="muted" style="font-size:calc(13.5px * var(--fs))">응모 경로는 2개 · <b>패스포트 완주(경로 5개)</b>는 대형경품 추첨(결과는 행사 종료 후 개별 안내), <b>QR 퀴즈 응모권</b>은 현장 즉석 추첨이에요.</p></div>';
  },

  /* ── v10 【신규 D】 사이니지 3종 · 프로토타입 (정식판: 무인 10시간·오프라인 캐시·키오스크) ── */

      '<div class="row" style="gap:6px">' + tvBtns() + '<button class="chip" style="background:rgba(255,255,255,0.08);color:#fff;border-color:rgba(255,255,255,0.3);white-space:nowrap" onclick="App.go(\'admin\')">← 콘솔</button></div></div>' +
      rows.map(function (r, i) {
        return '<div class="dbar' + (i < 3 ? " t" + (i + 1) : "") + '"><div class="nm"><b><span class="rk">' + (i + 1) + "</span>" + esc(r.d) + '</b><span class="pct">' + r.avg + '<span style="font-size:calc(14.5px * var(--fs))">점</span></span></div>' +
          '<div class="track"><div class="fill2" style="width:' + r.avg + '%"></div></div>' +

 * BE_POLL_MS 주기 sync 폴링으로 전달하고, 팝업 + (허용 시) 브라우저 알림을 띄운다. */
/* 시트 자동 형변환으로 "Sat Dec 30 1899 14:00:00..." 이 와도 HH:MM만 추린다 */
function hhmm(v) {
  var m = String(v == null ? "" : v).match(/(\d{1,2}):(\d{2})/);
  return m ? m[1] + ":" + m[2] : String(v == null ? "" : v);
}
function notifOK() { return ("Notification" in window) && Notification.permission === "granted"; }
function notifAsk() {

function qrHtml() {

  var n = 17, cells = "";
  var finder = function (r, c) { return (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7); };
  var finderBlack = function (r, c) {
    var rr = r >= n - 7 ? r - (n - 7) : r, cc = c >= n - 7 ? c - (n - 7) : c;
    return rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4);
  };
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {

  var doneList = GW.done.map(function (r) {
    return '<div class="card soft mb8"><p style="font-size:calc(15.5px * var(--fs));font-weight:800;color:var(--hi)">' + LINK_ROUNDS[r].s.join(" ") + '</p>' +
      '<p class="muted" style="font-size:calc(12.5px * var(--fs));margin-top:3px">' + esc(LINK_ROUNDS[r].why) + "</p></div>";
  }).join("");
  root.innerHTML =
    '<div class="chain-box" style="padding:26px 18px">' +
    '<p class="disp" style="font-size:34px;color:' + (cleared ? "var(--mint)" : "#8FA2C9") + '">' + (allDone ? "ALL CLEAR!" : cleared ? "CLEAR!" : "TIME UP") + "</p>" +
    '<p class="next" style="margin-top:8px">' + GW.score + "점 · 문장 " + GW.done.length + "/" + LINK_ROUNDS.length + " 완성 · 최고 " + S.get("gw_best", 0) + '점</p>' +
    (cleared ? '<p style="margin-top:8px;font-size:calc(14.5px * var(--fs));opacity:0.9">패스포트 「미니게임」 칸 적립 완료' + (allDone ? " · 전 라운드 완주" : "") + "</p>" :
      '<p style="margin-top:8px;font-size:calc(14.5px * var(--fs));opacity:0.9">문장 1개만 완성해도 클리어! 6초 헤매면 정답이 반짝여요.</p>') + "</div>" +
    doneList +
    '<button class="btn mint mb8" style="padding:15px" onclick="gwStart()">다시 도전</button>' +
    '<button class="btn line" onclick="App.go(\'ev_games\')">미니게임으로</button>';
}

/* ════════════════ 게임 B: 로드맵 초성퀴즈 ════════════════ */
var GC = { i: 0, correct: 0, active: false };
function gcStart() {
  GC = { i: 0, correct: 0, active: true };
  gcPaint();
}
function gcPaint(feed, feedOk) {
  var root = el("gcRoot"); if (!root) return;
  if (GC.i >= CHOSEONG_QUIZ.length) { gcEnd(); return; }
  var q = CHOSEONG_QUIZ[GC.i];
  root.innerHTML =
    '<div class="game-hud">' +
    '<div class="hud"><div class="v">' + (GC.i + 1) + "/" + CHOSEONG_QUIZ.length + '</div><div class="l">문제</div></div>' +
    '<div class="hud"><div class="v">' + GC.correct + '</div><div class="l">맞힌 개수 (목표 ' + GC_PASS + ')</div></div></div>' +
    '<div class="cho-box"><p style="font-size:calc(12.5px * var(--fs));font-weight:800;letter-spacing:0.08em;color:#8FA2C9">Q' + (GC.i + 1) + "</p>" +
    '<p class="cho">' + esc(q.cho) + '</p><p class="hint">' + esc(q.hint) + "</p></div>" +
    '<div class="gfeed' + (feedOk === true ? " ok" : feedOk === false ? " no" : "") + '">' + (feed || "") + "</div>" +
    '<div class="row" style="margin-top:4px"><input id="gcInput" class="input" placeholder="정답 입력" autocomplete="off" onkeydown="if(event.key===\'Enter\')gcSubmit()">' +
    '<button class="btn mint" style="width:auto;padding:12px 18px" onclick="gcSubmit()">제출</button></div>' +
    '<button class="btn line" style="margin-top:8px" onclick="gcSkip()">모르겠어요 (넘기기)</button>';
  var inp = el("gcInput"); if (inp) inp.focus();
}
function gcNorm(s) { return String(s || "").trim().toLowerCase().replace(/\s+/g, ""); }
function gcSubmit() {
  if (!GC.active) return;
  var q = CHOSEONG_QUIZ[GC.i];
  var v = gcNorm(el("gcInput") && el("gcInput").value);
  if (!v) return;
  var ok = v === gcNorm(q.a) || q.alts.some(function (a) { return v === gcNorm(a); });
  if (ok) GC.correct++;
  GC.i++;
  gcPaint(ok ? "정답! · " + q.a : "아쉽! 정답은 「" + q.a + "」", ok);
}
function gcSkip() {
  if (!GC.active) return;
  var q = CHOSEONG_QUIZ[GC.i];
  GC.i++;
  gcPaint("정답은 「" + q.a + "」 · 다음 문제!", false);
}
function gcEnd() {
  GC.active = false;
  var cleared = GC.correct >= GC_PASS;
  var root = el("gcRoot"); if (!root) return;
  root.innerHTML =
    '<div class="cho-box" style="padding:28px 18px">' +
    '<p class="disp" style="font-size:34px;color:' + (cleared ? "var(--mint)" : "#8FA2C9") + '">' + (cleared ? "CLEAR!" : GC.correct + "/8") + "</p>" +
    '<p style="font-size:20px;font-weight:800;margin-top:8px">' + GC.correct + "/" + CHOSEONG_QUIZ.length + " 정답</p>" +
    '<p class="hint">' + (cleared ? "패스포트 「미니게임」 칸 적립 완료. 힌트 속 로드맵, 이제 눈에 익으셨죠?" : "목표는 " + GC_PASS + "개 · 힌트 속에 로드맵이 다 들어있어요. 한 번 더?") + "</p></div>" +
    '<button class="btn mint mb8" style="padding:15px" onclick="gcStart()">다시 풀기</button>' +
    '<button class="btn line" onclick="App.go(\'ev_games\')">미니게임으로</button>';
  if (cleared) gameClear("gc_cleared");
}

/* ════════════════ 스플래시 → 앱 진입 ════════════════ */
(function () {
  var splash = el("splash");
  var intro = el("introV");
  var loop = el("loopV");
  var chime = el("chime");
  var chimeTimer = null;
  var CHIME_DELAY_MS = 500;

  var mediaReady = Promise.all([intro, loop, chime].map(function (m) {
    return fetch(m.src).then(function (r) { return r.blob(); })
      .then(function (b) { m.src = URL.createObjectURL(b); }).catch(function () {});
  }));

  function setPhase(p) { splash.dataset.phase = p; }
  function enterApp() {
    splash.classList.add("gone");
    el("frame").classList.remove("splash-mode");
    el("app").hidden = false;
    try { intro.pause(); loop.pause(); } catch (e) {}
    /* 글자 크기를 한 번도 고른 적 없으면, 그런 기능이 있다는 것만 조용히 알린다 (1회) */
    try {
      if (!localStorage.getItem(LS_FS)) setTimeout(function () {
        if (App.current === "home" && el("a2hs").hidden) toast("글씨가 작으면 오른쪽 위 톱니 아이콘, 설정에서 키울 수 있어요");
      }, 3200);
    } catch (e) {}
    var m = location.hash.match(/^#s=(\w+)/i);
    var mc = location.hash.match(/^#c=(\w+)/i);
    var mq = location.hash.match(/^#q=(wall[1-3])/i);
    App.go("home");
    if (m) {
      var got0 = S.get("stamps", []);
      var s = STAMPS.filter(function (x) { return x.code === m[1].toUpperCase(); })
        .find(function (x) { return got0.indexOf(x.id) < 0; });
      if (s) setTimeout(function () { awardStamp(s.id); }, 400);
    }
    if (mc && mc[1] === FESTIVAL.adminCode) {
      setTimeout(function () { redeemCoffee(); }, 500);
    }
    if (mq) {
      setTimeout(function () { wqOpen(mq[1].toLowerCase()); }, 400);
    }
  }
  function goReady() {
    if (chimeTimer) clearTimeout(chimeTimer);
    loop.play().catch(function () {});
    setPhase("ready");
  }
  function startIntro(withSound) {
    setPhase("intro");
    mediaReady.then(function () {
      intro.play().catch(goReady);
      loop.play().catch(function () {});
      if (withSound) chimeTimer = setTimeout(function () { chime.play().catch(function () {}); }, CHIME_DELAY_MS);
    });
  }
  function skipIntro() {
    if (!chime.paused) chime.pause();
    intro.pause(); goReady();
  }

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) setPhase("static");

  // 캡처 모드(#...cap): 프레임을 좌상단 고정 정폭으로 · 헤드리스 스크린샷용
  if (/cap/.test(location.hash)) {
    document.body.style.justifyContent = "flex-start";
    var fr = el("frame");
    fr.style.width = "448px"; fr.style.maxWidth = "none"; fr.style.boxShadow = "none";
  }

  // 데모/캡처 훅: #demo=화면명 으로 열면 로그인·데이터 세팅 후 해당 화면으로 바로 진입 (스크린샷·시연용)
  var dm = location.hash.match(/^#demo(?:=(\w+))?/i);
  if (dm) {
    LS_OK = false;   /* 데모 시드가 실사용 저장소를 오염시키지 않게 */
    S.set("user", { empId: "1234", name: "김하이" });
    S.set("stamps", ["p1", "p4", "p5"]);
    S.set("coffee_issued", true);
    S.set("quiz_answers", { q1: { choice: 1, correct: true, replay: false, ts: Date.now() } });
    S.set("quiz_state", { activeId: "q1", phase: "revealed", openedAt: Date.now() - 60000, finishedIds: ["q1"] });
    S.set("cchat", { status: "matched", round: "14:30", table: "B", ts: Date.now() });
    S.set("gw_cleared", true);
    S.set("dept", "보상부문");
    S.set("wq_attempts", [{ set: "wall1", score: 80, passed: true, attemptNo: 1, dept: "보상부문", ts: Date.now() }]);
    S.set("entries", [{ id: "e1", code: "E-4821", source: "quiz", set: "wall1", ts: Date.now() }]);
    var target = dm[1] || "home";
    if (["admin", "screen", "wall_quiz", "wall_wave", "wall_live", "wall_metowe", "wall_rank", "wall_tv"].indexOf(target) >= 0) S.set("admin_authed", true);
    splash.classList.add("gone");
    el("frame").classList.remove("splash-mode");
    el("app").hidden = false;
    App.go(target);
    return;
  }

  /* ── 재방문: 이 기기를 기억하고 있으면 영상 스플래시를 건너뛰고 PIN만 받는다 ── */
  /* v19: 이 기기에서 입장한 적 있으면 스플래시·PIN 없이 바로 재입장 (로그아웃은 설정에서) */
  var savedU = S.get("user", {});
  if (savedU && savedU.empId) {
    enterApp();
    return;
  }
  var known = BE.on ? knownGet() : null;
  function quickLogin() {
    var pin = el("quickPin").value.trim();
    var qe = el("qErr"), btn = el("qBtn");
    var show = function (m) { qe.textContent = m; qe.style.display = "block"; };
    if (!/^\d{4}$/.test(pin)) { show("PIN 4자리를 입력해주세요."); return; }
    qe.style.display = "none";
    btn.disabled = true; btn.textContent = "확인 중…";
    var reset = function () { btn.disabled = false; btn.textContent = "입장"; };
    beHash(known.empId, pin).then(function (h) {
      beCall({ action: "login", emp: known.empId, name: known.name, h: h }, function (res) {
        reset();
        if (!res || !res.ok) {
          var msg = {
            pw: "PIN이 일치하지 않습니다. 처음 설정한 4자리를 입력해주세요.",
            notfound: "명부에서 찾을 수 없습니다. 운영진에게 문의해주세요.",
            name: "이름이 명부와 일치하지 않습니다.",
            param: "다시 시도해주세요."
          };
          show((res && msg[res.reason]) || "연결에 실패했어요. 잠시 후 다시 시도해주세요.");
          el("quickPin").value = "";
          return;
        }
        S.set("user", { empId: known.empId, name: res.name || known.name, dept: res.dept || "" });
        if (res.dept) S.set("dept", res.dept);
        knownSet({ empId: known.empId, name: res.name || known.name, dept: res.dept || "" });
        el("quick").hidden = true;
        enterApp();
        beStats();
        a2hsAuto();
      }, function () { reset(); show("서버에 연결할 수 없어요. 네트워크를 확인해주세요."); });
    });
  }
  if (known && known.empId) {
    splash.classList.add("gone");
    el("qName").textContent = known.name || "";
    el("qEmp").textContent = known.empId;
    el("quick").hidden = false;
    setTimeout(function () { try { el("quickPin").focus(); } catch (e) {} }, 150);
    el("qBtn").addEventListener("click", quickLogin);
    el("quickPin").addEventListener("keydown", function (e) { if (e.key === "Enter") quickLogin(); });
    el("qOther").addEventListener("click", function () {
      knownClear();
      el("quick").hidden = true;
      splash.classList.remove("gone");
    });
  }

  el("cover").addEventListener("click", function () { startIntro(true); });
  el("silent").addEventListener("click", function (e) { e.stopPropagation(); skipIntro(); });
  el("silent").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); skipIntro(); } });
  el("skip").addEventListener("click", skipIntro);
  intro.addEventListener("ended", goReady);

  /* 오프라인(서버 미연결)이면 PIN 입력을 숨긴다 */
  if (!BE.on) {
    if (el("userPin")) el("userPin").style.display = "none";
    if (el("pinNote")) el("pinNote").style.display = "none";
  }

  el("entryForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = el("empId").value.trim();
    var nm = el("userName").value.trim();
    var pin = el("userPin") ? el("userPin").value.trim() : "";
    var err = el("err");
    var btn = el("entryForm").querySelector("button");
    var show = function (m) { err.textContent = m; err.style.display = "block"; };
    /* 사번 형식은 회사마다 달라 느슨하게 받고, 실제 확인은 서버(명부)가 한다 */
    if (!/^[A-Za-z0-9-]{3,15}$/.test(id)) { show("사번을 확인해주세요."); return; }
    if (nm.length < 2) { show("이름을 입력해주세요."); return; }
    err.style.display = "none";

    if (!BE.on) {                       /* 서버 없이 단독 동작 (기존 방식) */
      S.set("user", { empId: id, name: nm });
      enterApp();
      a2hsAuto();
      return;
    }
    if (!/^\d{4}$/.test(pin)) { show("행사 PIN 4자리를 입력해주세요."); return; }

    btn.disabled = true; btn.textContent = "확인 중…";
    var reset = function () { btn.disabled = false; btn.textContent = "페스티벌 입장"; };
    beHash(id, pin).then(function (h) {
      beCall({ action: "login", emp: id, name: nm, h: h }, function (res) {
        reset();
        if (!res || !res.ok) {
          var msg = {
            notfound: "명부에 없는 사번입니다. 운영진에게 문의해주세요.",
            name: "사번과 이름이 일치하지 않습니다.",
            pw: "PIN이 일치하지 않습니다. 처음 설정한 4자리를 입력해주세요.",
            param: "입력값을 다시 확인해주세요."
          };
          show((res && msg[res.reason]) || "연결에 실패했어요. 잠시 후 다시 시도해주세요.");
          return;
        }
        S.set("user", { empId: id, name: res.name || nm, dept: res.dept || "" });
        if (res.dept) S.set("dept", res.dept);
        knownSet({ empId: id, name: res.name || nm, dept: res.dept || "" });   /* 다음 접속엔 PIN만 */
        enterApp();
        beStats();
        a2hsAuto();
        if (res.isNew) setTimeout(function () {
          toast("PIN이 등록되었어요. 다음 접속에도 같은 4자리를 사용하세요");
        }, 700);
      }, function () {
        reset();
        show("서버에 연결할 수 없어요. 네트워크를 확인해주세요.");
      });
    });
  });
})();
</script>
