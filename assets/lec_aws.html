<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>바이브코딩 실습 소개 · AX Festival</title>
<style>
  /* 앱 상세 vhero(16:9)용 세션 소개 모션. design.md 다크 카드 규정.
     논리 좌표 1280x720. 20초 루프, 무음 전제(자막이 곧 메시지). */
  :root{
    --u: min(calc(100vw / 1280), calc(100vh / 720));
    --ink:#1E2124; --gold:#FF9E1B; --o100:#FF7E31; --dim:#B9BEC6;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);overflow:hidden;font-family:var(--font);color:#fff;word-break:keep-all}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #stage{position:relative;width:calc(1280*var(--u));height:calc(720*var(--u));overflow:hidden;background:var(--ink)}

  /* 고정 아이덴티티 한 줄 (장식 아님 · 정보) */
  #ident{position:absolute;top:calc(38*var(--u));left:0;width:100%;text-align:center;
         font-size:calc(22*var(--u));font-weight:700;color:var(--dim);letter-spacing:.04em}
  #ident b{color:var(--o100);font-weight:900}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         text-align:center;padding:calc(60*var(--u)) calc(90*var(--u));
         opacity:0;visibility:hidden;transition:opacity .3s ease}
  .scene.on{opacity:1;visibility:visible}
  .scene:not(.on){transition:none}
  .up{opacity:0;transform:translateY(calc(16*var(--u)));
      transition:opacity .45s cubic-bezier(.2,.7,.2,1),transform .45s cubic-bezier(.2,.7,.2,1);
      transition-delay:var(--d,0s)}
  .scene.on .up{opacity:1;transform:none}
  .scene:not(.on) .up{transition:none}

  .hook{font-size:calc(56*var(--u));font-weight:800;line-height:1.3;letter-spacing:-.02em}
  .hook .big{display:block;margin-top:calc(4*var(--u));font-size:calc(66*var(--u));font-weight:900;color:var(--gold)}
  .lead{font-size:calc(26*var(--u));font-weight:800;color:var(--o100);letter-spacing:.05em}
  .big2{margin-top:calc(12*var(--u));font-size:calc(56*var(--u));font-weight:900;line-height:1.3;letter-spacing:-.015em}
  .who{margin-top:calc(20*var(--u));font-size:calc(28*var(--u));font-weight:700;color:#fff}
  .who em{font-style:normal;color:var(--dim);font-weight:600}
  .meta{margin-top:calc(16*var(--u));font-size:calc(25*var(--u));font-weight:600;color:var(--dim)}
  .meta b{color:var(--gold);font-weight:800}
  .cta{margin-top:calc(20*var(--u));display:inline-block;padding:calc(14*var(--u)) calc(34*var(--u));
       border-radius:calc(12*var(--u));background:var(--o100);color:#fff;
       font-size:calc(26*var(--u));font-weight:800}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="ident"><b>AX</b> FESTIVAL ㆍ 10. 26 (월)</div>

  <section class="scene" data-t0="0" data-t1="3.0">
    <div class="hook">
      <span class="up" style="--d:.1s">코드 한 줄 없이,</span>
      <span class="up big" style="--d:.32s">오늘 만듭니다</span>
    </div>
  </section>

  <section class="scene" data-t0="3.0" data-t1="9.0">
    <div class="up lead" style="--d:.1s">바이브코딩 실습</div>
    <div class="up big2" style="--d:.3s">코드 없이 만드는 3시간</div>
    <div class="up meta" style="--d:.55s">테트리스에서 실적 분석 · 약관 챗봇까지</div>
  </section>

  <section class="scene" data-t0="9.0" data-t1="14.5">
    <div class="up lead" style="--d:.1s">SPEAKER</div>
    <div class="up big2" style="--d:.3s">AWS</div>
    <div class="up meta" style="--d:.55s">Claude Code CLI · Kiro IDE</div>
  </section>

  <section class="scene" data-t0="14.5" data-t1="20.0">
    <div class="up meta" style="--d:.1s;font-size:calc(28*var(--u))"><b>13:10 ~ 16:30</b> ㆍ 10F Heart 5 · 6</div>
    <div class="up cta" style="--d:.4s">아래에서 바로 신청하세요</div>
  </section>
</div></div>

<script>
(function(){
  var TOTAL = 20.0;
  var scenes = [].slice.call(document.querySelectorAll('.scene')).map(function(el){
    return { el: el, t0: +el.dataset.t0, t1: +el.dataset.t1 };
  });
  var start = Date.now(), offset = 0;
  function tick(){
    var t = ((Date.now() - start) / 1000 + offset) % TOTAL;
    scenes.forEach(function(s){
      var on = t >= s.t0 && t < s.t1;
      if (on !== s.el.classList.contains('on')) s.el.classList.toggle('on', on);
    });
  }
  setInterval(tick, 50); tick();
  window.seek = function(t){ start = Date.now(); offset = t; tick(); };
  var q = new URLSearchParams(location.search).get('t');
  if (q !== null) window.seek(parseFloat(q) || 0);
})();
</script>
</body>
</html>
